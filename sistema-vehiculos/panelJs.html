<script>
  /* =====================================================
   VARIABLES DEL PANEL ADMINISTRATIVO
===================================================== */

  let usuarioPanel = null;
  let vehiculosAdministracion = [];
  let ordenParqueaderosAdministracion = [];
  let vehiculoSeleccionadoAdministracion = null;
  let vehiculoIntercambioSeleccionado = null;
  let citasAdministracion = [];
  let citaEditandoId = null;
  let modoEdicionCita = false;
  let intervaloAlertasCitas = null;
  let alertasCitasMostradas = {};

  /* =====================================================
   ABRIR PANEL ADMINISTRATIVO
===================================================== */

  function abrirPanelAdministrativo(usuario, restaurarEstado = false) {
    usuarioPanel = usuario || null;

    const app = document.querySelector(".app");

    const panel = document.getElementById("panelAdministrativo");

    if (!panel) {
      console.error("No se encontró #panelAdministrativo");

      return;
    }

    // Ocultar pantalla pública
    if (app) {
      app.style.display = "none";
    }

    const historial = document.getElementById("historial");

    if (historial) {
      historial.style.display = "none";
    }

    const infoInferior = document.querySelector(".info-inferior");

    if (infoInferior) {
      infoInferior.style.display = "none";
    }

    // Mostrar panel
    panel.style.display = "block";

    actualizarInformacionPanel();

    configurarPermisosPanel();

    // Limpiar visualmente antes de decidir
    // qué pantalla mostrar.
    ocultarTodosLosModulosPanel();

    cerrarSubmodulosGestion();

    cerrarMenuAdministrativo();

    const inicio = document.getElementById("inicioPanelAdministrativo");

    const contenido = document.getElementById("contenidoModuloPanel");

    const menuPrincipal = document.getElementById("panelMenuPrincipal");

    // =====================================================
    // REFRESCO DE PÁGINA
    // =====================================================

    if (restaurarEstado) {
      const moduloGuardado = sessionStorage.getItem("moduloPanelActivo");

      if (moduloGuardado) {
        if (inicio) {
          inicio.style.display = "none";
        }

        if (contenido) {
          contenido.style.display = "block";
        }
      } else {
        if (inicio) {
          inicio.style.display = "block";
        }

        if (menuPrincipal) {
          menuPrincipal.style.display = "grid";
        }

        if (contenido) {
          contenido.style.display = "none";
        }
      }
    }

    // =====================================================
    // LOGIN NORMAL
    // =====================================================
    else {
      if (inicio) {
        inicio.style.display = "block";
      }

      if (menuPrincipal) {
        menuPrincipal.style.display = "grid";
      }

      if (contenido) {
        contenido.style.display = "none";
      }
    }

    if (inicio && inicio.style.display !== "none") {
      animarContenedorVisible(inicio);
    }

    // Cargar información
    cargarVehiculosAdministracion();

    cargarOrdenParqueaderosAdministracion();

    cargarAtencionRapidaCitas();

    // Restaurar módulo DESPUÉS de configurar
    // completamente el panel.
    if (restaurarEstado) {
      setTimeout(function () {
        restaurarModuloPanelActivo();
      }, 50);
    }

    window.scrollTo({
      top: 0,
      behavior: "auto",
    });
  }

  // =====================================================
  // RESTAURAR MÓDULO ACTIVO DEL PANEL
  // =====================================================

  function restaurarModuloPanelActivo() {
    const moduloGuardado = sessionStorage.getItem("moduloPanelActivo");

    console.log("Módulo guardado:", moduloGuardado);

    if (!moduloGuardado) {
      return;
    }

    switch (moduloGuardado) {
      case "moduloInventario":
        if (typeof abrirModuloInventario === "function") {
          abrirModuloInventario();
        }

        break;

      case "moduloUbicacion":
        abrirModuloUbicacion();

        break;

      case "moduloDocumentacion":
        abrirModuloDocumentacion();

        break;

      case "moduloPicoPlacaManana":
        abrirModuloPicoPlacaManana();

        break;

      case "moduloPerfil":
        abrirModuloPerfil();

        break;

      case "moduloGestion":
        abrirModuloGestion();

        break;

      case "moduloHistorial":
        abrirModuloHistorial();

        break;

      case "moduloCitas":
        abrirModuloCitas();

        break;

      default:
        console.warn("Módulo desconocido:", moduloGuardado);

        sessionStorage.removeItem("moduloPanelActivo");

        break;
    }
  }

  /* =====================================================
   ACTUALIZAR INFORMACIÓN DEL USUARIO
===================================================== */

  function actualizarInformacionPanel() {
    if (!usuarioPanel) {
      return;
    }

    const nombre = document.getElementById("panelNombreUsuario");

    const rol = document.getElementById("panelRolUsuario");

    if (nombre) {
      nombre.textContent =
        usuarioPanel.nombre || usuarioPanel.usuario || "Usuario";
    }

    if (rol) {
      rol.textContent = usuarioPanel.rol || usuarioPanel.tipo || "USUARIO";
    }

    const perfilNombre = document.getElementById("perfilNombre");

    const perfilUsuario = document.getElementById("perfilUsuario");

    const perfilEmail = document.getElementById("perfilEmail");

    const perfilRol = document.getElementById("perfilRol");

    if (perfilNombre) {
      perfilNombre.textContent = usuarioPanel.nombre || "Usuario";
    }

    if (perfilUsuario) {
      perfilUsuario.textContent = usuarioPanel.usuario || "-";
    }

    if (perfilEmail) {
      perfilEmail.textContent = usuarioPanel.email || "-";
    }

    if (perfilRol) {
      perfilRol.textContent =
        usuarioPanel.rol || usuarioPanel.tipo || "USUARIO";
    }
  }

  /* =====================================================
   PERMISOS SEGÚN EL ROL
===================================================== */

  function configurarPermisosPanel() {
    const opcionGestion = document.getElementById("opcionGestion");

    const opcionHistorial = document.getElementById("opcionHistorial");

    const opcionEditarCarros = document.getElementById("opcionEditarCarros");

    const opcionCitas = document.getElementById("opcionCitas");

    const rol =
      usuarioPanel && usuarioPanel.rol
        ? usuarioPanel.rol.toString().trim().toUpperCase()
        : "";

    const esAdministrador = rol === "ADMINISTRADOR" || rol === "ADMIN";

    /* ==========================================
    CITAS
    Solo Administrador
  ========================================== */

    if (opcionCitas) {
      opcionCitas.style.display = esAdministrador ? "flex" : "none";
    }

    /* ==========================================
     GESTIÓN
     Solo Administrador
  ========================================== */

    if (opcionGestion) {
      opcionGestion.style.display = esAdministrador ? "flex" : "none";
    }

    /* ==========================================
     HISTORIAL
     Solo Administrador
  ========================================== */

    if (opcionHistorial) {
      opcionHistorial.style.display = esAdministrador ? "flex" : "none";
    }

    /* ==========================================
     EDITAR CARROS
     Ya no debe aparecer para ningún rol
  ========================================== */

    if (opcionEditarCarros) {
      opcionEditarCarros.style.display = "none";
    }
  }

  /* =====================================================
   CARGAR VEHÍCULOS
===================================================== */

  function cargarVehiculosAdministracion() {
    if (!tokenSesion) {
      return;
    }

    google.script.run

      .withSuccessHandler(function (respuesta) {
        if (!respuesta || !respuesta.success) {
          console.error(
            respuesta && respuesta.mensaje
              ? respuesta.mensaje
              : "No se pudieron cargar los vehículos.",
          );

          return;
        }

        vehiculosAdministracion = Array.isArray(respuesta.vehiculos)
          ? respuesta.vehiculos
          : [];

        actualizarListaUbicacion();
        actualizarListaInventario();
        actualizarListaEditarCarros();
        actualizarListaGestionUbicacion();

        actualizarAtencionRapidaUbicacion();
        actualizarAtencionRapidaDocumentacion();
        actualizarAtencionRapidaPicoPlaca();
      })

      .withFailureHandler(function (error) {
        console.error("Error al cargar vehículos:", error);
      })

      .obtenerVehiculosAdministracion(tokenSesion);
  }

  /* =====================================================
   MOSTRAR / OCULTAR MÓDULOS
===================================================== */

  function ocultarTodosLosModulosPanel() {
    const modulos = document.querySelectorAll(
      "#contenidoModuloPanel .modulo-panel, #moduloInventario, #gestionUsuarios, #moduloCitas",
    );

    modulos.forEach(function (modulo) {
      modulo.style.display = "none";
    });
  }

  function cerrarSubmodulosGestion() {
    const submodulos = document.querySelectorAll(
      "#moduloGestion .gestion-submodulo",
    );

    submodulos.forEach(function (submodulo) {
      submodulo.style.display = "none";
    });
  }

  /* =====================================================
   VOLVER AL PANEL PRINCIPAL
===================================================== */

  function volverPanelPrincipal() {
    sessionStorage.removeItem("moduloPanelActivo");

    const menu = document.getElementById("panelMenuPrincipal");

    const contenido = document.getElementById("contenidoModuloPanel");

    if (menu) {
      menu.style.display = "grid";
    }

    const inicio = document.getElementById("inicioPanelAdministrativo");

    if (inicio) {
      inicio.style.display = "block";
    }

    animarContenedorVisible(inicio);

    if (contenido) {
      contenido.style.display = "none";
    }

    ocultarTodosLosModulosPanel();
    cerrarSubmodulosGestion();

    vehiculoSeleccionadoAdministracion = null;

    window.scrollTo({
      top: 0,
      behavior: "smooth",
    });
  }

  /* =====================================================
   MOSTRAR UN MÓDULO
===================================================== */

  function mostrarModuloPanel(idModulo) {
    const menu = document.getElementById("panelMenuPrincipal");

    const contenido = document.getElementById("contenidoModuloPanel");

    const modulo = document.getElementById(idModulo);

    if (idModulo !== "moduloCitas") {
      detenerAlertasCitas();
    }

    if (!contenido || !modulo) {
      return;
    }

    sessionStorage.setItem("moduloPanelActivo", idModulo);

    if (menu) {
      menu.style.display = "none";
    }

    const inicio = document.getElementById("inicioPanelAdministrativo");

    if (inicio) {
      inicio.style.display = "none";
    }

    contenido.style.display = "block";

    ocultarTodosLosModulosPanel();
    cerrarSubmodulosGestion();

    modulo.style.display = "block";

    animarContenedorVisible(modulo);

    window.scrollTo({
      top: 0,
      behavior: "smooth",
    });
  }

  /* =====================================================
   ESCAPAR TEXTO PARA HTML
===================================================== */

  function escaparHTML(texto) {
    return String(texto ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* =====================================================
   MÓDULO UBICACIÓN
===================================================== */

  function abrirModuloUbicacion() {
    const editor = document.getElementById("editorUbicacion");

    const detalle = document.getElementById("detalleUbicacion");

    const lista = document.getElementById("listaVehiculosUbicacion");

    if (editor) {
      editor.style.display = "none";
    }

    if (detalle) {
      detalle.style.display = "none";
    }

    if (lista) {
      lista.style.display = "block";
    }

    vehiculoSeleccionadoAdministracion = null;

    mostrarModuloPanel("moduloUbicacion");

    configurarBuscadorUbicacion();

    actualizarListaUbicacion();
  }

  function actualizarListaUbicacion(vehiculosFiltrados) {
    const contenedor = document.getElementById("listaVehiculosUbicacion");

    if (!contenedor) {
      return;
    }

    const listaVehiculos = Array.isArray(vehiculosFiltrados)
      ? vehiculosFiltrados
      : vehiculosAdministracion;

    // =================================================
    // RESUMEN DE UBICACIÓN
    // =================================================

    const totalVehiculos = document.getElementById("parqueaderoTotalVehiculos");

    const vehiculosUbicados = document.getElementById(
      "parqueaderoVehiculosUbicados",
    );

    if (totalVehiculos) {
      totalVehiculos.textContent = Array.isArray(vehiculosAdministracion)
        ? vehiculosAdministracion.length
        : 0;
    }

    if (vehiculosUbicados) {
      const cantidadUbicados = Array.isArray(vehiculosAdministracion)
        ? vehiculosAdministracion.filter(function (vehiculo) {
            return String(vehiculo.ubicacion || "").trim() !== "";
          }).length
        : 0;

      vehiculosUbicados.textContent = cantidadUbicados;
    }

    if (!listaVehiculos.length) {
      contenedor.innerHTML = `
    <div class="panel-modulo-placeholder">
      <strong>No se encontraron vehículos.</strong>
      <p>Intenta con otro término de búsqueda.</p>
    </div>
  `;

      return;
    }

    // Agrupar vehículos por parqueadero
    const grupos = {};

    listaVehiculos.forEach(function (vehiculo) {
      const ubicacion =
        vehiculo.ubicacion && vehiculo.ubicacion.trim()
          ? vehiculo.ubicacion.trim()
          : "Sin ubicación asignada";

      if (!grupos[ubicacion]) {
        grupos[ubicacion] = [];
      }

      grupos[ubicacion].push(vehiculo);
    });

    let html = "";

    const ubicacionesOrdenadas = Object.keys(grupos).sort(function (a, b) {
      return a.localeCompare(b, "es", {
        sensitivity: "base",
        numeric: true,
      });
    });

    ubicacionesOrdenadas.forEach(function (ubicacion, indice) {
      const vehiculos = [...grupos[ubicacion]].sort(function (a, b) {
        const nombreA = String(a.nombre || "").trim();

        const nombreB = String(b.nombre || "").trim();

        const coincidenciaA = nombreA.match(/^(.*?)(?:\s+(\d{4}))?$/);

        const coincidenciaB = nombreB.match(/^(.*?)(?:\s+(\d{4}))?$/);

        const nombreBaseA = coincidenciaA ? coincidenciaA[1].trim() : nombreA;

        const nombreBaseB = coincidenciaB ? coincidenciaB[1].trim() : nombreB;

        const comparacionNombre = nombreBaseA.localeCompare(nombreBaseB, "es", {
          sensitivity: "base",
        });

        if (comparacionNombre !== 0) {
          return comparacionNombre;
        }

        const anioA =
          coincidenciaA && coincidenciaA[2] ? Number(coincidenciaA[2]) : 0;

        const anioB =
          coincidenciaB && coincidenciaB[2] ? Number(coincidenciaB[2]) : 0;

        if (anioA !== anioB) {
          return anioA - anioB;
        }

        return nombreA.localeCompare(nombreB, "es", {
          sensitivity: "base",
          numeric: true,
        });
      });

      const cantidad = vehiculos.length;

      const grupoId = `parqueaderoGrupo_${indice}`;

      html += `
      <section
        class="parqueadero-grupo"
        data-grupo="${grupoId}">

        <div class="parqueadero-grupo-encabezado">

          <div class="parqueadero-grupo-titulo">

            <span class="parqueadero-grupo-icono parqueadero-grupo-icono-lottie">
              <lottie-player
                src="https://lottie.host/dde843bc-f2bf-4e2c-bc3b-749eb86c1a5e/YwwlQuU3dK.json"
                background="transparent"
                speed="1">
              </lottie-player>
            </span>

            <div>

              <h3>
                ${escaparHTML(ubicacion)}
              </h3>

              <span>
                ${cantidad}
                ${cantidad === 1 ? "vehículo" : "vehículos"}
              </span>

            </div>

          </div>

        </div>


        <div
          id="${grupoId}"
          class="parqueadero-grupo-lista">

          ${vehiculos
            .map(function (vehiculo, posicion) {
              const nombre = escaparHTML(vehiculo.nombre || "Vehículo");

              const placa = escaparHTML(vehiculo.placa || "-");

              return `
                <article
                  class="parqueadero-vehiculo-card ${
                    posicion >= 2 ? "parqueadero-vehiculo-oculto" : ""
                  }"
                  style="${posicion >= 3 ? "display:none;" : ""}"
                  data-posicion="${posicion}">

                  <button
                    type="button"
                    class="parqueadero-vehiculo-boton"
                    onclick="abrirDetalleUbicacion('${escaparHTML(
                      vehiculo.placa || "",
                    )}')">

                    <div class="parqueadero-vehiculo-icono">
                      🚗
                    </div>

                    <div class="parqueadero-vehiculo-info">

                      <strong>
                        ${nombre}
                      </strong>

                      <small>
                        ${placa}
                      </small>

                    </div>

                    <span class="parqueadero-vehiculo-flecha">
                      ›
                    </span>

                  </button>

                </article>
              `;
            })
            .join("")}

        </div>


        ${
          cantidad > 3
            ? `
              <button
                type="button"
                class="parqueadero-mostrar-mas"
                onclick="alternarVehiculosParqueadero('${grupoId}', this)">

                <span>
                  Ver ${cantidad - 3}
                  ${cantidad - 3 === 1 ? "vehículo" : "vehículos"}
                  más
                </span>

                <span>
                  ↓
                </span>

              </button>
            `
            : ""
        }

      </section>
    `;
    });

    contenedor.innerHTML = html;

    animarContenedorVisible(contenedor);
  }

  function configurarBuscadorUbicacion() {
    const buscador = document.getElementById("buscadorVehiculosUbicacion");

    if (!buscador) {
      return;
    }

    if (buscador.dataset.configurado === "true") {
      return;
    }

    buscador.dataset.configurado = "true";

    buscador.addEventListener("input", function () {
      const termino = buscador.value.trim().toLowerCase();

      if (!termino) {
        actualizarListaUbicacion();

        return;
      }

      const resultados = vehiculosAdministracion.filter(function (vehiculo) {
        const nombre = String(vehiculo.nombre || "").toLowerCase();

        const placa = String(vehiculo.placa || "").toLowerCase();

        const ubicacion = String(vehiculo.ubicacion || "").toLowerCase();

        return (
          nombre.includes(termino) ||
          placa.includes(termino) ||
          ubicacion.includes(termino)
        );
      });

      actualizarListaUbicacion(resultados);
    });
  }

  function mostrarVehiculosSinParqueadero() {
    const boton = document.getElementById("btnVehiculosSinParqueadero");

    const estaFiltrado = boton && boton.dataset.filtrado === "true";

    if (estaFiltrado) {
      actualizarListaUbicacion(vehiculosAdministracion);

      boton.dataset.filtrado = "false";

      boton.innerHTML = `
      <span>🚫</span>
      <span>Vehículos sin Ubicacion</span>
    `;

      return;
    }

    const resultados = vehiculosAdministracion.filter(function (vehiculo) {
      return String(vehiculo.ubicacion || "").trim() === "";
    });

    actualizarListaUbicacion(resultados);

    if (boton) {
      boton.dataset.filtrado = "true";

      boton.innerHTML = `
      <span>↩️</span>
      <span>Mostrar todos los vehículos</span>
    `;
    }
  }

  function alternarVehiculosParqueadero(grupoId, boton) {
    const grupo = document.getElementById(grupoId);

    if (!grupo) {
      return;
    }

    const vehiculosOcultos = grupo.querySelectorAll(
      ".parqueadero-vehiculo-oculto",
    );

    const expandido = grupo.classList.contains("parqueadero-grupo-expandido");

    if (expandido) {
      vehiculosOcultos.forEach(function (item) {
        item.style.display = "none";
      });

      grupo.classList.remove("parqueadero-grupo-expandido");

      boton.innerHTML = `
      <span>
        Ver ${vehiculosOcultos.length}
        ${vehiculosOcultos.length === 1 ? "vehículo" : "vehículos"}
        más
      </span>

      <span>
        ↓
      </span>
    `;
    } else {
      vehiculosOcultos.forEach(function (item) {
        item.style.display = "block";
      });

      grupo.classList.add("parqueadero-grupo-expandido");

      boton.innerHTML = `
      <span>
        Mostrar menos
      </span>

      <span>
        ↑
      </span>
    `;
    }
  }

  function abrirDetalleUbicacion(placa) {
    const vehiculo = vehiculosAdministracion.find(function (item) {
      return (
        String(item.placa || "")
          .trim()
          .toUpperCase() ===
        String(placa || "")
          .trim()
          .toUpperCase()
      );
    });

    if (!vehiculo) {
      return;
    }

    const lista = document.getElementById("listaVehiculosUbicacion");

    const detalle = document.getElementById("detalleUbicacion");

    if (!detalle) {
      return;
    }

    if (lista) {
      lista.style.display = "none";
    }

    detalle.style.display = "block";

    const nombre = document.getElementById("detalleUbicacionNombre");

    const placaElemento = document.getElementById("detalleUbicacionPlaca");

    const ubicacion = document.getElementById("detalleUbicacionParqueadero");

    const transito = document.getElementById("detalleUbicacionTransito");

    if (nombre) {
      nombre.textContent = vehiculo.nombre || "Vehículo";
    }

    if (placaElemento) {
      placaElemento.textContent = vehiculo.placa || "-";
    }

    if (ubicacion) {
      ubicacion.textContent =
        vehiculo.ubicacion && vehiculo.ubicacion.trim()
          ? vehiculo.ubicacion
          : "Sin ubicación asignada";
    }

    if (transito) {
      transito.textContent =
        vehiculo.transito && vehiculo.transito.trim()
          ? vehiculo.transito
          : "Sin tránsito registrado";
    }

    window.scrollTo({
      top: 0,
      behavior: "smooth",
    });
  }

  function cerrarDetalleUbicacion() {
    const lista = document.getElementById("listaVehiculosUbicacion");

    const detalle = document.getElementById("detalleUbicacion");

    if (detalle) {
      detalle.style.display = "none";
    }

    const editor = document.getElementById("editorUbicacion");

    if (editor) {
      editor.style.display = "none";
    }

    if (lista) {
      lista.style.display = "block";
    }

    vehiculoSeleccionadoAdministracion = null;

    window.scrollTo({
      top: 0,
      behavior: "smooth",
    });
  }

  function abrirIntercambioParqueadero() {
    const placaElemento = document.getElementById("detalleUbicacionPlaca");

    if (!placaElemento) {
      return;
    }

    const placa = placaElemento.textContent.replace("Placa: ", "").trim();

    const vehiculo = vehiculosAdministracion.find(function (item) {
      return String(item.placa || "").trim() === placa;
    });

    if (!vehiculo) {
      return;
    }

    vehiculoSeleccionadoAdministracion = vehiculo;

    const contenedorVehiculo = document.getElementById(
      "intercambioVehiculoActual",
    );

    if (contenedorVehiculo) {
      contenedorVehiculo.innerHTML = `
      <strong>${vehiculo.nombre || ""} ${vehiculo.nombre || ""}</strong>
      <div>Placa: ${vehiculo.placa || ""}</div>
      <div>📍 ${vehiculo.ubicacion || "Sin Ubicacion"}</div>
    `;
    }

    const modal = document.getElementById("modalIntercambioParqueadero");

    if (modal) {
      modal.style.display = "flex";
    }

    console.log("Vehículo seleccionado para intercambio:", vehiculo);
  }

  function cerrarIntercambioParqueadero() {
    const modal = document.getElementById("modalIntercambioParqueadero");

    const buscador = document.getElementById("buscadorIntercambioParqueadero");

    const lista = document.getElementById("listaIntercambioParqueadero");

    const segundo = document.getElementById("intercambioVehiculoSegundo");

    const boton = document.getElementById("btnConfirmarIntercambio");

    if (modal) {
      modal.style.display = "none";
    }

  /* =====================================================
   NORMALIZAR FECHA DEL EDITOR
===================================================== */

  function normalizarFechaEditorAdministracion(fecha) {
    if (!fecha) {
      return "";
    }

    const texto = String(fecha).trim();

    if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) {
      return texto;
    }

    const coincidencia = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

    if (coincidencia) {
      const dia = coincidencia[1].padStart(2, "0");

      const mes = coincidencia[2].padStart(2, "0");

      const año = coincidencia[3];

      return `${año}-${mes}-${dia}`;
    }

    const fechaObjeto = new Date(texto);

    if (Number.isNaN(fechaObjeto.getTime())) {
      return "";
    }

    const año = fechaObjeto.getFullYear();

    const mes = String(fechaObjeto.getMonth() + 1).padStart(2, "0");

    const dia = String(fechaObjeto.getDate()).padStart(2, "0");

    return `${año}-${mes}-${dia}`;
  }

          }

          return;
        }

        if (respuesta.token) {
          tokenSesion = respuesta.token;

          sessionStorage.setItem("tokenSesion", tokenSesion);
        }

        if (usuarioPanel) {
          usuarioPanel.nombre = nombreNuevo;

          usuarioPanel.usuario = usuarioNuevo;

          usuarioPanel.email = emailNuevo;
        }

        actualizarInformacionPanel();

        cancelarEdicionPerfilAdministracion();

        mostrarAlerta(
          "✅",
          "Perfil actualizado",
          `
            <div style="text-align:center;">
              ${escaparHTML(
                respuesta.mensaje || "Perfil actualizado correctamente.",
              )}
            </div>
          `,
        );
      })

      .withFailureHandler(function (error) {
        console.error("Error al actualizar perfil:", error);

        if (mensaje) {
          mensaje.textContent = "Ocurrió un error al actualizar el perfil.";

          mensaje.style.display = "block";
        }
      })

      .actualizarPerfilUsuario(
        tokenSesion,
        nombreNuevo,
        usuarioNuevo,
        emailNuevo,
        nuevaContraseña,
      );
  }

      submodulo.style.display = "none";

    const gestionUsuarios = document.getElementById("gestionUsuarios");

    if (gestionUsuarios) {
      gestionUsuarios.style.display = "none";

    const opciones = document.querySelectorAll(
      "#moduloGestion .gestion-opcion",
    );

    opciones.forEach(function (opcion) {
      opcion.classList.remove("gestion-opcion-activa");

  function mostrarSubmoduloGestionDebajo(idBoton, idModulo) {
    const boton = document.getElementById(idBoton);

    if (!boton || !modulo) {
      return;
    }

    ocultarOpcionesGestion();

    boton.classList.add("gestion-opcion-activa");

    boton.insertAdjacentElement("afterend", modulo);

    modulo.style.display = "block";

    animarContenedorVisible(modulo);

  // =====================================================
  // CARGAR PARQUEADEROS EN GESTIÓN
  // =====================================================

  function cargarParqueaderosGestion() {
    const lista = document.getElementById("listaParqueaderosGestion");

    if (!lista) {
      return;
    }

    lista.innerHTML = `
    <div class="gestion-vacio">
      Cargando parqueaderos...
    </div>
  `;

    google.script.run
      .withSuccessHandler(function (respuesta) {
        if (!respuesta || !respuesta.success) {
          lista.innerHTML = `
            <div class="gestion-vacio">
              ${
                respuesta && respuesta.mensaje
                  ? escaparHTML(respuesta.mensaje)
                  : "No fue posible cargar los parqueaderos."
              }
            </div>
          `;

          return;
        }

        const parqueaderos = Array.isArray(respuesta.parqueaderos)
          ? respuesta.parqueaderos
          : [];

        if (parqueaderos.length === 0) {
          lista.innerHTML = `
            <div class="gestion-vacio">
              No hay parqueaderos registrados.
            </div>
          `;

          return;
        }

        lista.innerHTML = parqueaderos
          .map(function (parqueadero) {
            return `
                <article class="vehiculo-panel-card">

                  <div class="vehiculo-panel-info">

                    <h3>
                      ${escaparHTML(parqueadero.nombre || "Ubicacion")}
                    </h3>

                    <span class="vehiculo-panel-placa">
                      ${escaparHTML(parqueadero.estado || "SIN ESTADO")}
                    </span>

                  </div>

                  <div class="vehiculo-panel-acciones">

                    <button
                      type="button"
                      class="vehiculo-panel-boton"
                      onclick="editarParqueaderoGestion('${escaparHTML(
                        parqueadero.nombre || "",
                      )}')">

                      Editar

                    </button>

                    <button
                      type="button"
                      class="vehiculo-panel-boton"
                      onclick="eliminarParqueaderoGestion('${escaparHTML(
                        parqueadero.nombre || "",
                      )}')">

                      Eliminar

                    </button>

                  </div>

                </article>
              `;
          })
          .join("");
      })
      .withFailureHandler(function (error) {
        console.error("Error al cargar parqueaderos:", error);

        lista.innerHTML = `
          <div class="gestion-vacio">
            Ocurrió un error al cargar los parqueaderos.
          </div>
        `;
      })
      .obtenerParqueaderosAdministracion(tokenSesion);

  // =====================================================
  // CREAR PARQUEADERO
  // =====================================================

  function crearParqueaderoGestion() {
    const input = document.getElementById("nuevoParqueaderoGestion");

    if (!input) {
      return;
    }

    const nombre = input.value.trim();

    if (!nombre) {
      mostrarAlerta(
        "⚠️",
        "Nombre requerido",
        "<p>Debes indicar el nombre de la Ubicacion.</p>",
      );

      input.focus();

      return;
    }

    google.script.run
      .withSuccessHandler(function (respuesta) {
        if (!respuesta || !respuesta.success) {
          mostrarAlerta(
            "⚠️",
            "No se pudo crear",
            "<p>" +
              (respuesta && respuesta.mensaje
                ? escaparHTML(respuesta.mensaje)
                : "No fue posible crear la Ubicacion.") +
              "</p>",
          );

          return;
        }

        input.value = "";

        mostrarAlerta(
          "✅",
          "Ubicacion creada",
          "<p>" +
            escaparHTML(
              respuesta.mensaje || "Ubicacion creada correctamente.",
            ) +
            "</p>",
        );

        cargarParqueaderosGestion();
      })
      .withFailureHandler(function (error) {
        console.error("Error al crear Ubicacion:", error);

        mostrarAlerta(
          "❌",
          "Error",
          "<p>Ocurrió un error al crear la Ubicacion.</p>",
        );
      })
      .crearParqueadero(tokenSesion, nombre);
  }

  // =====================================================
  // EDITAR PARQUEADERO
  // =====================================================

  function editarParqueaderoGestion(nombreParqueadero) {
    const nombre = (nombreParqueadero || "").toString().trim();

    if (!nombre) {
      return;
    }

    const lista = document.getElementById("listaParqueaderosGestion");

    if (!lista) {
      return;
    }

    const tarjetas = lista.querySelectorAll(".vehiculo-panel-card");

    tarjetas.forEach(function (tarjeta) {
      const titulo = tarjeta.querySelector(".vehiculo-panel-info h3");

      if (!titulo) {
        return;
      }

      const nombreTarjeta = titulo.textContent.trim();

      if (nombreTarjeta.toLowerCase() !== nombre.toLowerCase()) {
        return;
      }

      const acciones = tarjeta.querySelector(".vehiculo-panel-acciones");

      if (!acciones) {
        return;
      }

      titulo.innerHTML = `
      <input
        type="text"
        class="input-editar-parqueadero"
        value="${escaparHTML(nombre)}"
        autocomplete="off"
      />
    `;

      acciones.innerHTML = `
      <button
        type="button"
        class="vehiculo-panel-boton"
        onclick="guardarEdicionParqueaderoGestion(this, '${escaparHTML(
          nombre,
        )}')">

        Guardar

      </button>

      <button
        type="button"
        class="vehiculo-panel-boton"
        onclick="cancelarEdicionParqueaderoGestion()">

        Cancelar

      </button>
    `;

      const input = titulo.querySelector(".input-editar-parqueadero");

      if (input) {
        input.focus();
        input.select();
      }
    });
  }

  function guardarEdicionParqueaderoGestion(boton, nombreAnterior) {
    const tarjeta = boton.closest(".vehiculo-panel-card");

    if (!tarjeta) {
      return;
    }

    const input = tarjeta.querySelector(".input-editar-parqueadero");

    if (!input) {
      return;
    }

    const nombreNuevo = input.value.trim();

    if (!nombreNuevo) {
      mostrarAlerta(
        "⚠️",
        "Nombre requerido",
        "<p>Debes indicar el nombre de la ubicacion.</p>",
      );

      input.focus();

      return;
    }

    if (nombreNuevo.toLowerCase() === nombreAnterior.toLowerCase()) {
      cargarParqueaderosGestion();

      return;
    }

    boton.disabled = true;

    google.script.run
      .withSuccessHandler(function (respuesta) {
        boton.disabled = false;

        if (!respuesta || !respuesta.success) {
          mostrarAlerta(
            "⚠️",
            "No se pudo actualizar",
            "<p>" +
              (respuesta && respuesta.mensaje
                ? escaparHTML(respuesta.mensaje)
                : "No fue posible actualizar la Ubicacion.") +
              "</p>",
          );

          input.focus();

          return;
        }

        mostrarAlerta(
          "✅",
          "Ubicacion actualizada",
          "<p>" +
            escaparHTML(
              respuesta.mensaje || "Ubicacion actualizada correctamente.",
            ) +
            "</p>",
        );

        cargarParqueaderosGestion();
      })
      .withFailureHandler(function (error) {
        boton.disabled = false;

        console.error("Error al actualizar Ubicacion:", error);

        mostrarAlerta(
          "❌",
          "Error",
          "<p>Ocurrió un error al actualizar la Ubicacion.</p>",
        );
      })
      .actualizarParqueadero(tokenSesion, nombreAnterior, nombreNuevo);
  }

  function cancelarEdicionParqueaderoGestion() {
    cargarParqueaderosGestion();
  }

          "Ubicacion eliminada",
          `<p>${escaparHTML(

        cargarParqueaderosGestion();

  function confirmarEliminarParqueaderoGestion() {
    const modal = document.getElementById("modalConfirmarEliminarParqueadero");

    if (!modal) {
      return;
    }

    const nombre = (modal.dataset.parqueadero || "").toString().trim();

    if (!nombre) {

    if (boton) {

        if (!respuesta || !respuesta.success) {
          mostrarAlerta(

            respuesta.mensaje || "La Ubicacion fue eliminado correctamente.",
          )}</p>`,

        cargarParqueaderosGestion();

        if (boton) {
          boton.disabled = false;
          boton.textContent = "🗑️ Eliminar";
        }

        mostrarAlerta(
          "⚠️",
          "Error",
          "<p>Ocurrió un error al eliminar la Ubicacion.</p>",

  function actualizarListaGestionUbicacion() {
    const lista = document.getElementById("listaGestionUbicacion");

    if (!lista) {
      return;
    }

    const buscador = document.getElementById("buscadorEditarUbicacion");

    const textoBusqueda = buscador
      ? buscador.value.toString().trim().toUpperCase()
      : "";

    const vehiculosFiltrados = vehiculosAdministracion.filter(
      function (vehiculo) {
        const nombre = String(vehiculo.nombre || "").toUpperCase();

        const placa = String(vehiculo.placa || "").toUpperCase();

        return nombre.includes(textoBusqueda) || placa.includes(textoBusqueda);
      },
    );

    const editor = document.getElementById("editorGestionUbicacion");

    if (editor) {
      editor.style.display = "none";
    }

    lista.style.display = "block";

    lista.innerHTML = "";

    if (
      !Array.isArray(vehiculosAdministracion) ||
      vehiculosAdministracion.length === 0
    ) {
      lista.innerHTML = `
      <div class="gestion-vacio">
        No hay vehículos registrados.
      </div>
    `;

      return;
    }

    vehiculosFiltrados.forEach(function (vehiculo) {
      const tarjeta = document.createElement("div");

      tarjeta.className = "gestion-ubicacion-item";

      tarjeta.innerHTML = `

          <div class="gestion-ubicacion-icono">
            🚗
          </div>

          <div class="gestion-ubicacion-datos">

              ${escapeHtml(vehiculo.nombre || "Vehículo")}
            </strong>

            <span>

              ${escapeHtml(vehiculo.placa || "-")}
            </span>

            <small>
              📍 ${escapeHtml(vehiculo.ubicacion || "Sin ubicación asignada")}

          Editar

        </button>

      if (botonEditar) {

        });
      }

      lista.appendChild(tarjeta);

  function filtrarEditarUbicacion() {
    actualizarListaGestionUbicacion();

  function seleccionarVehiculoGestionUbicacion(placa) {
    const vehiculo = vehiculosAdministracion.find(function (item) {
      return (
        String(item.placa || "")
          .trim()
          .toUpperCase() ===
        String(placa || "")
          .trim()
          .toUpperCase()
      );
    });

    if (!vehiculo) {
      alert("No se encontró el vehículo seleccionado.");

      return;
    }

    vehiculoSeleccionadoAdministracion = vehiculo;

    mostrarEditorGestionUbicacion();
  }

  function mostrarEditorGestionUbicacion() {
    if (!vehiculoSeleccionadoAdministracion) {
      return;
    }

    const lista = document.getElementById("listaGestionUbicacion");

    const editor = document.getElementById("editorGestionUbicacion");

    if (lista) {
      lista.style.display = "none";
    }

    if (editor) {
      editor.style.display = "block";
    }

    const nombre = document.getElementById("gestionUbicacionNombre");

    const placa = document.getElementById("gestionUbicacionPlaca");

    const ubicacion = document.getElementById("gestionUbicacionParqueadero");

    if (nombre) {
      nombre.textContent =
        vehiculoSeleccionadoAdministracion.nombre || "Vehículo";
    }

    if (placa) {
      placa.textContent =
        "Placa: " + (vehiculoSeleccionadoAdministracion.placa || "-");
    }

    if (ubicacion && tokenSesion) {
      google.script.run
        .withSuccessHandler(function (respuesta) {
          if (
            !respuesta ||
            !respuesta.success ||
            !Array.isArray(respuesta.parqueaderos)
          ) {
            return;
          }

          ubicacion.innerHTML = `
            <option value="">
              Selecciona una Ubicacion
            </option>
          `;

          respuesta.parqueaderos.forEach(function (parqueadero) {
            const option = document.createElement("option");

            option.value = parqueadero.nombre || "";

            option.textContent = parqueadero.nombre || "";

            ubicacion.appendChild(option);
          });

          ubicacion.value = vehiculoSeleccionadoAdministracion.ubicacion || "";
        })
        .obtenerParqueaderosAdministracion(tokenSesion);
    }

    const mensaje = document.getElementById("mensajeEditorGestionUbicacion");

    if (mensaje) {
      mensaje.textContent = "";

      mensaje.className = "editor-ubicacion-mensaje";
    }

  function cerrarEditorGestionUbicacion() {
    const editor = document.getElementById("editorGestionUbicacion");

    const lista = document.getElementById("listaGestionUbicacion");

    if (editor) {
      editor.style.display = "none";
    }

    if (lista) {
      lista.style.display = "block";
    }

  function guardarCambiosGestionUbicacion() {

    const ubicacion =
      document.getElementById("gestionUbicacionParqueadero")?.value.trim() ||
      "";

    const datos = {
      placa: vehiculoSeleccionadoAdministracion.placa || "",

      nombre: vehiculoSeleccionadoAdministracion.nombre || "",

      ubicacion: ubicacion,

    mostrarConfirmacionGestionUbicacion(datos);

  /* =====================================================

===================================================== */

  function confirmarGuardadoGestionUbicacion() {
    const modal = document.getElementById("modalConfirmacionGestionUbicacion");

    if (!modal || !modal.dataset.datos) {
      return;
    }

    let datos = null;

    try {
      datos = JSON.parse(modal.dataset.datos);
    } catch (error) {
      console.error("Error leyendo datos de ubicación:", error);

      return;
    }

    if (!datos || !datos.placa || !tokenSesion) {
      return;
    }

    const boton = modal.querySelector(".editor-ubicacion-boton-principal");

    if (boton) {
      boton.disabled = true;

      boton.textContent = "Guardando...";
    }

    google.script.run

      .withSuccessHandler(function (respuesta) {
        if (!respuesta || !respuesta.success) {
          if (boton) {
            boton.disabled = false;

            boton.textContent = "Guardar cambios";
          }

          mostrarMensajeGestionUbicacion(
            respuesta && respuesta.mensaje
              ? respuesta.mensaje
              : "No se pudieron guardar los cambios.",
            "error",
          );

          return;
        }

        const vehiculo = vehiculosAdministracion.find(function (item) {
          return (
            String(item.placa || "")
              .trim()
              .toUpperCase() ===
            String(datos.placa || "")
              .trim()
              .toUpperCase()
          );
        });

        if (vehiculo) {
          vehiculo.ubicacion =
            respuesta.vehiculo && respuesta.vehiculo.ubicacion
              ? respuesta.vehiculo.ubicacion
              : datos.ubicacion;

          vehiculoSeleccionadoAdministracion = vehiculo;
        }

        cancelarConfirmacionGestionUbicacion();

        if (boton) {
          boton.disabled = false;

          boton.textContent = "Guardar cambios";
        }

        mostrarEditorGestionUbicacion();

        mostrarMensajeGestionUbicacion(
          "La ubicación fue actualizada correctamente.",
          "success",
        );
      })

      .withFailureHandler(function (error) {
        console.error("Error al actualizar ubicación:", error);

        if (boton) {
          boton.disabled = false;

          boton.textContent = "Guardar cambios";
        }

        mostrarMensajeGestionUbicacion(
          "Ocurrió un error al actualizar la ubicación.",
          "error",
        );
      })

      .actualizarUbicacionVehiculo(tokenSesion, datos.placa, datos.ubicacion);
  }

  function configurarBuscadorHistorial() {
    const buscador = document.getElementById("buscadorHistorialGeneral");

    const botonLimpiar = document.getElementById("limpiarBusquedaHistorial");

    if (!buscador) {
      return;
    }

    buscador.addEventListener("input", function () {
      busquedaHistorialActual = buscador.value.trim().toLowerCase();

      if (botonLimpiar) {
        botonLimpiar.style.display = busquedaHistorialActual ? "flex" : "none";
      }

      renderizarResultadosHistorial();
    });

    if (botonLimpiar) {
      botonLimpiar.addEventListener("click", function () {
        buscador.value = "";

        busquedaHistorialActual = "";

        botonLimpiar.style.display = "none";

        buscador.focus();

        renderizarResultadosHistorial();
      });
    }
  }

  /* =====================================================
   SELECCIONAR CATEGORÍA
===================================================== */

  function seleccionarCategoriaHistorial(categoria) {
    filtroHistorialActual = categoria;

    const categorias = document.querySelectorAll(".historial-categoria");

    categorias.forEach(function (item) {
      item.classList.remove("activo");
    });

    const botones = document.querySelectorAll(".historial-categoria");

    botones.forEach(function (item) {
      const texto = item.getAttribute("onclick") || "";

      if (texto.includes("'" + categoria + "'")) {
        item.classList.add("activo");
      }
    });

    renderizarResultadosHistorial();
  }

  /* =====================================================
   FILTRAR Y MOSTRAR RESULTADOS
===================================================== */

  function renderizarResultadosHistorial() {
    const contenedor = document.getElementById("historialResultados");

    if (!contenedor) {
      return;
    }

    const movimientos = Array.isArray(window.historialMovimientosActuales)
      ? window.historialMovimientosActuales
      : [];

    let resultados = movimientos.filter(function (movimiento) {
      const categoria = obtenerCategoriaHistorial(movimiento);

      const coincideCategoria =
        filtroHistorialActual === "TODOS" ||
        categoria === filtroHistorialActual;

      if (!coincideCategoria) {
        return false;
      }

      if (!busquedaHistorialActual) {
        return true;
      }

      const textoCompleto = [
        movimiento.fecha,

        movimiento.usuario,

        movimiento.usuarioSistema,

        movimiento.vehiculo,

        movimiento.placa,

        movimiento.accion,

        movimiento.tipoMovimiento,

        movimiento.campo,

        movimiento.valorAnterior,

        movimiento.valorNuevo,

        movimiento.ubicacionAnterior,

        movimiento.ubicacionNueva,
      ]

        .map(function (valor) {
          return String(valor || "").toLowerCase();
        })

        .join(" ");

      return textoCompleto.includes(busquedaHistorialActual);
    });

    if (!resultados.length) {
      contenedor.innerHTML = `

      <div class="historial-vacio">

        <div class="historial-vacio-icono">
          🔎
        </div>

        <strong>
          No se encontraron movimientos
        </strong>

        <span>
          ${
            busquedaHistorialActual
              ? "Prueba con otro término de búsqueda."
              : "No hay movimientos en esta categoría."
          }
        </span>

      </div>

    `;

      return;
    }

    contenedor.innerHTML = `

    <div class="historial-resultados-encabezado">

      <strong>
        ${resultados.length}
        ${resultados.length === 1 ? "movimiento" : "movimientos"}
      </strong>

      <span>
        ${obtenerNombreCategoriaHistorial(filtroHistorialActual)}
      </span>

    </div>


    <div class="historial-listado">

      ${resultados
        .map(function (movimiento, indice) {
          return crearTarjetaHistorial(movimiento, indice, resultados);
        })
        .join("")}

    </div>

  `;
  }

  /* =====================================================
   DETERMINAR CATEGORÍA
===================================================== */

  function obtenerCategoriaHistorial(movimiento) {
    const tipo = String(movimiento.tipoMovimiento || "")
      .trim()
      .toUpperCase();

    const campo = String(movimiento.campo || "")
      .trim()
      .toUpperCase();

    const accion = String(movimiento.accion || "")
      .trim()
      .toUpperCase();

    if (tipo.includes("USUARIO") || accion.includes("USUARIO")) {
      return "USUARIOS";
    }

    if (
      tipo.includes("UBICACIÓN") ||
      tipo.includes("UBICACION") ||
      tipo.includes("PARQUEADERO") ||
      campo.includes("UBICACIÓN") ||
      campo.includes("UBICACION")
    ) {
      return "PARQUEADERO";
    }

    if (
      tipo.includes("SOAT") ||
      tipo.includes("TECNOMECÁNICA") ||
      tipo.includes("TECNOMECANICA") ||
      campo.includes("SOAT") ||
      campo.includes("TECNOMECÁNICA") ||
      campo.includes("TECNOMECANICA") ||
      accion.includes("SOAT") ||
      accion.includes("TECNOMECÁNICA") ||
      accion.includes("TECNOMECANICA")
    ) {
      return "DOCUMENTACION";
    }

    return "VEHICULOS";
  }

  function obtenerIconoHistorial(movimiento) {
    const categoria = obtenerCategoriaHistorial(movimiento);

    const campo = String(movimiento.campo || "")
      .trim()
      .toUpperCase();

    if (campo === "PRECIO") {
      return "💰";

    if (campo === "KILOMETRAJE") {
      return "📏";
    }

    if (campo.includes("SOAT")) {
      return "🛡️";
    }

    if (campo.includes("TECNOMECÁNICA") || campo.includes("TECNOMECANICA")) {
      return "🔧";
    }

    if (campo.includes("PICO Y PLACA")) {
      return "🚦";

    if (campo.includes("UBICACIÓN") || campo.includes("UBICACION")) {
      return "📍";
    }

    if (categoria === "USUARIOS") {
      return "👥";

    if (categoria === "DOCUMENTACION") {

    return "🚗";

  /* =====================================================
   DETALLE CORTO
===================================================== */

  function obtenerDetalleHistorial(movimiento) {
    const campo = String(movimiento.campo || "")
      .trim()
      .toUpperCase();

    const anterior =
      movimiento.valorAnterior !== undefined &&
      movimiento.valorAnterior !== null
        ? String(movimiento.valorAnterior)
        : "";

    const nuevo =
      movimiento.valorNuevo !== undefined && movimiento.valorNuevo !== null
        ? String(movimiento.valorNuevo)
        : "";

    /*
     * Registros nuevos:
     * CAMPO + valor anterior → nuevo
     */

    if (campo && (anterior || nuevo)) {
      return (
        campo +
        ": " +
        (anterior || "Sin asignar") +
        " → " +
        (nuevo || "Sin asignar")
      );
    }

    /*
     * Compatibilidad con registros
     * antiguos del historial.
     */

    let detalle = "";

    if (movimiento.ubicacionAnterior || movimiento.ubicacionNueva) {
      detalle =
        "Ubicación: " +
        (movimiento.ubicacionAnterior || "Sin asignar") +
        " → " +
        (movimiento.ubicacionNueva || "Sin asignar");
    }

    return detalle || "Movimiento registrado en el sistema.";
  }

  /* =====================================================
   FORMATEAR FECHA DEL HISTORIAL
===================================================== */

  function formatearFechaHistorial(fecha) {
    if (!fecha) {
      return "";
    }

    const valor = String(fecha).trim();

    if (!valor) {
      return "";
    }

    /*
     * Google Sheets normalmente devuelve
     * la fecha como dd/MM/yyyy HH:mm:ss.
     */

    const coincidencia = valor.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/,
    );

    if (coincidencia) {
      const dia = coincidencia[1].padStart(2, "0");

      const mes = coincidencia[2].padStart(2, "0");

      const año = coincidencia[3];

      let resultado = `${dia}/${mes}/${año}`;

      if (coincidencia[4] && coincidencia[5]) {
        resultado += ` · ${coincidencia[4].padStart(2, "0")}:${coincidencia[5]}`;
      }

      return resultado;
    }

    return valor;
  }

  function actualizarAtencionRapidaDocumentacion() {
    const elemento = document.getElementById("atencionRapidaDocumentacion");

    if (!elemento) {
      return;
    }

    if (!Array.isArray(vehiculosAdministracion)) {
      elemento.textContent = "No fue posible consultar documentos";

      return;
    }

    const hoy = new Date();

    hoy.setHours(0, 0, 0, 0);

    const limite = new Date(hoy);

    limite.setDate(limite.getDate() + 10);

    let documentosAtencion = 0;

    function requiereAtencion(fechaTexto) {
      if (!fechaTexto) {
        return true;
      }

      const partes = String(fechaTexto).substring(0, 10).split("/");

      if (partes.length !== 3) {
        return true;
      }

      const fecha = new Date(
        Number(partes[2]),
        Number(partes[1]) - 1,
        Number(partes[0]),
      );

      if (isNaN(fecha.getTime())) {
        return true;
      }

      return fecha <= limite;
    }

    vehiculosAdministracion.forEach(function (vehiculo) {
      if (requiereAtencion(vehiculo.soat)) {
        documentosAtencion++;
      }

      if (requiereAtencion(vehiculo.tecnomecanica)) {
        documentosAtencion++;
      }
    });

    if (documentosAtencion === 0) {
      elemento.textContent = "Todos los documentos al día ✓";

      return;
    }

    if (documentosAtencion === 1) {
      elemento.textContent = "1 documento requiere atención ›";

      return;
    }

    elemento.textContent =
      documentosAtencion + " documentos requieren atención ›";
  }

  function cargarDocumentacionAtencion() {

    if (!contenedor) {

    const hoy = new Date();

    hoy.setHours(0, 0, 0, 0);

    const limite = new Date(hoy);

    limite.setDate(limite.getDate() + 10);

    function convertirFecha(fechaTexto) {
      if (!fechaTexto) {
        return null;
      }

      const partes = String(fechaTexto).substring(0, 10).split("/");

      if (partes.length !== 3) {
        return null;
      }

      const fecha = new Date(
        Number(partes[2]),
        Number(partes[1]) - 1,
        Number(partes[0]),
      );

      if (isNaN(fecha.getTime())) {
        return null;
      }

      fecha.setHours(0, 0, 0, 0);

      return fecha;
    }

    function obtenerEstadoDocumento(nombreDocumento, fechaTexto) {
      const fecha = convertirFecha(fechaTexto);

      if (!fecha) {
        return {
          requiereAtencion: true,
          tipo: "SIN_FECHA",
          icono: nombreDocumento === "SOAT" ? "📄" : "🔧",
          nombre: nombreDocumento,
          estado: "Sin fecha registrada",
        };
      }

      const diferenciaMs = fecha.getTime() - hoy.getTime();

      const dias = Math.ceil(diferenciaMs / (1000 * 60 * 60 * 24));

      if (dias < 0) {
        return {
          requiereAtencion: true,
          tipo: "VENCIDO",
          icono: nombreDocumento === "SOAT" ? "📄" : "🔧",
          nombre: nombreDocumento,
          estado:
            "Vencido hace " +
            Math.abs(dias) +
            (Math.abs(dias) === 1 ? " día" : " días"),
        };
      }

      if (dias === 0) {
        return {
          requiereAtencion: true,
          tipo: "POR_VENCER",
          icono: nombreDocumento === "SOAT" ? "📄" : "🔧",
          nombre: nombreDocumento,
          estado: "Vence hoy",
        };
      }

      if (fecha <= limite) {
        return {
          requiereAtencion: true,
          tipo: "POR_VENCER",
          icono: nombreDocumento === "SOAT" ? "📄" : "🔧",
          nombre: nombreDocumento,
          estado: "Vence en " + dias + (dias === 1 ? " día" : " días"),
        };
      }

      return {
        requiereAtencion: false,
      };
    }

    const vehiculosConAlertas = vehiculosAdministracion
      .map(function (vehiculo) {
        const documentos = [];

        const soat = obtenerEstadoDocumento("SOAT", vehiculo.soat);

        const tecnomecanica = obtenerEstadoDocumento(
          "Tecnomecánica",
          vehiculo.tecnomecanica,
        );

        if (soat.requiereAtencion) {
          documentos.push(soat);
        }

        if (tecnomecanica.requiereAtencion) {
          documentos.push(tecnomecanica);
        }

        return {
          vehiculo: vehiculo,
          documentos: documentos,
        };
      })
      .filter(function (item) {
        return item.documentos.length > 0;
      });

    const vehiculosPorVencer = vehiculosConAlertas
      .map(function (item) {
        return {
          vehiculo: item.vehiculo,

          documentos: item.documentos.filter(function (documento) {
            return documento.tipo === "POR_VENCER";
          }),
        };
      })
      .filter(function (item) {
        return item.documentos.length > 0;
      });

    const vehiculosVencidos = vehiculosConAlertas
      .map(function (item) {
        return {
          vehiculo: item.vehiculo,

          documentos: item.documentos.filter(function (documento) {
            return (
              documento.tipo === "VENCIDO" || documento.tipo === "SIN_FECHA"
            );
          }),
        };
      })
      .filter(function (item) {
        return item.documentos.length > 0;
      });

    if (vehiculosPorVencer.length === 0 && vehiculosVencidos.length === 0) {
      contenedor.innerHTML = `
    <div class="documentacion-atencion-vacio">

      <span>
        ✅
      </span>

      <strong>
        Todos los documentos están al día
      </strong>

      <small>
        No hay SOAT ni tecnomecánicas próximas a vencer.
      </small>

    </div>
  `;

      return;
    }

    function crearHTMLDocumentacion(lista) {
      return lista
        .map(function (item) {
          const vehiculo = item.vehiculo;

          const documentosHTML = item.documentos
            .map(function (documento) {
              return `
                  <div class="documentacion-documento">

                    <span class="documentacion-documento-icono">
                      ${documento.icono}
                    </span>

                    <div class="documentacion-documento-contenido">

                      <strong>
                        ${escaparHTML(documento.nombre)}
                      </strong>

                      <small>
                        ${escaparHTML(documento.estado)}
                      </small>

                    </div>

                  </div>
                `;
            })
            .join("");

          return `
          <div class="documentacion-card">

            <div class="documentacion-card-encabezado">

              <div class="documentacion-card-vehiculo">

                <strong>
                  ${escaparHTML(vehiculo.nombre || "Vehículo")}
                </strong>

                <small>
                  ${escaparHTML(vehiculo.placa || "Sin placa")}
                </small>

              </div>

            </div>


            <div class="documentacion-documentos">

              ${documentosHTML}

            </div>

          </div>
        `;
        })
        .join("");
    }

    let html = "";

    if (vehiculosPorVencer.length > 0) {
      html += `
      <div class="documentacion-seccion documentacion-seccion--por-vencer">

        <div class="documentacion-seccion-titulo">
          <span class="documentacion-seccion-icono">
            ⚠️
          </span>

          <span>
            Por vencer
          </span>

          <small>
            ${vehiculosPorVencer.length}
          </small>
        </div>

      ${crearHTMLDocumentacion(vehiculosPorVencer)}

    </div>
  `;
    }

    if (vehiculosVencidos.length > 0) {
      html += `
    <div class="documentacion-seccion documentacion-seccion--vencidos">

      <div class="documentacion-seccion-titulo">
        <span class="documentacion-seccion-icono">
          ❌
        </span>

        <span>
          Vencidos
        </span>

        <small>
          ${vehiculosVencidos.length}
        </small>
      </div>

      ${crearHTMLDocumentacion(vehiculosVencidos)}

    </div>
  `;
    }

    contenedor.innerHTML = html;
  }

  function actualizarAtencionRapidaPicoPlaca() {
    const elemento = document.getElementById("atencionRapidaPicoPlaca");

    if (!elemento) {
      return;
    }

    if (!Array.isArray(vehiculosAdministracion)) {
      elemento.textContent = "No fue posible consultar la restricción";

      return;
    }

    const manana = new Date();

    manana.setDate(manana.getDate() + 1);

    const diasSemana = [
      "domingo",
      "lunes",
      "martes",
      "miércoles",
      "jueves",
      "viernes",
      "sábado",
    ];

    const diaManana = diasSemana[manana.getDay()];

    function normalizarDiaPico(texto) {
      return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    const diaComparar = normalizarDiaPico(diaManana);

    const vehiculosConPico = vehiculosAdministracion.filter(
      function (vehiculo) {
        const pico = normalizarDiaPico(vehiculo.picoYPlaca);

        return pico === diaComparar;
      },
    );

    const cantidad = vehiculosConPico.length;

    const nombreDia = diaManana.charAt(0).toUpperCase() + diaManana.slice(1);

    if (cantidad === 0) {
      elemento.textContent = nombreDia + ": ningún vehículo ✓";

      return;
    }

    if (cantidad === 1) {
      elemento.textContent = nombreDia + ": 1 vehículo con restricción ›";

      return;
    }

    elemento.textContent =
      nombreDia + ": " + cantidad + " vehículos con restricción ›";
  }

  function cargarAtencionRapidaCitas() {
    const item = document.getElementById("atencionRapidaCitasItem");

    const resumen = document.getElementById("atencionRapidaCitasResumen");

    if (!item || !resumen) {
      return;
    }

    const rol =
      usuarioPanel && usuarioPanel.rol
        ? String(usuarioPanel.rol).trim().toUpperCase()
        : "";

    if (rol !== "ADMINISTRADOR" && rol !== "ADMIN") {
      item.style.display = "none";

      return;
    }

    item.style.display = "flex";

    resumen.textContent = "Revisando citas de hoy...";

    google.script.run

      .withSuccessHandler(function (respuesta) {
        if (
          !respuesta ||
          !respuesta.success ||
          !Array.isArray(respuesta.citas)
        ) {
          resumen.textContent = "No fue posible consultar las citas.";

          return;
        }

        const ahora = new Date();

        const dia = String(ahora.getDate()).padStart(2, "0");

        const mes = String(ahora.getMonth() + 1).padStart(2, "0");

        const anio = ahora.getFullYear();

        const fechaHoy = dia + "/" + mes + "/" + anio;

        const ahoraMs = Date.now();

        const citasActivas = respuesta.citas.filter(function (cita) {
          const estado = String(cita.estado || "")
            .trim()
            .toUpperCase();

          return estado !== "ATENDIDA" && estado !== "CANCELADA";
        });

        const citasAtrasadas = citasActivas
          .filter(function (cita) {
            const fechaHora = obtenerFechaHoraCitaMs(cita);

            return fechaHora > 0 && fechaHora < ahoraMs;
          })
          .sort(function (a, b) {
            return obtenerFechaHoraCitaMs(b) - obtenerFechaHoraCitaMs(a);
          });

        const citasHoy = citasActivas
          .filter(function (cita) {
            const fechaHora = obtenerFechaHoraCitaMs(cita);

            return (
              String(cita.fecha || "").trim() === fechaHoy &&
              fechaHora >= ahoraMs
            );
          })
          .sort(function (a, b) {
            return obtenerFechaHoraCitaMs(a) - obtenerFechaHoraCitaMs(b);
          });

        if (citasAtrasadas.length > 0) {
          if (citasHoy.length > 0) {
            resumen.textContent =
              "⚠️ " +
              citasAtrasadas.length +
              (citasAtrasadas.length === 1
                ? " cita atrasada"
                : " citas atrasadas") +
              " · " +
              citasHoy.length +
              (citasHoy.length === 1 ? " cita hoy" : " citas hoy");
          } else {
            resumen.textContent =
              "⚠️ " +
              citasAtrasadas.length +
              (citasAtrasadas.length === 1
                ? " cita atrasada"
                : " citas atrasadas");
          }

          return;
        }

        if (citasHoy.length === 0) {
          resumen.textContent = "No hay citas pendientes para hoy ✓";

          return;
        }

        if (citasHoy.length === 1) {
          const cita = citasHoy[0];

          resumen.textContent =
            "1 cita hoy · " +
            (cita.hora || "") +
            " · " +
            (cita.vehiculo || "Vehículo");

          return;
        }

        const primera = citasHoy[0];

        const segunda = citasHoy[1];

        resumen.textContent =
          citasHoy.length +
          " citas hoy · Próxima: " +
          (primera.hora || "") +
          " " +
          (primera.vehiculo || "Vehículo") +
          " · Luego: " +
          (segunda.hora || "") +
          " " +
          (segunda.vehiculo || "Vehículo");
      })

      .obtenerCitasAdministracion(tokenSesion);
  }

  /* =====================================================

===================================================== */

  function guardarNuevoVehiculo(datos) {
    if (!datos || !tokenSesion) {
      return;
    }

    const mensaje = document.getElementById("mensajeAgregarVehiculo");

    const advertencia = document.getElementById("advertenciaNuevoVehiculo");

    const boton = advertencia
      ? advertencia.querySelector(".editor-vehiculo-boton-principal")
      : null;

    if (boton) {
      boton.disabled = true;
      boton.textContent = "GUARDANDO...";
    }

    if (mensaje) {
      mensaje.style.display = "none";

      mensaje.textContent = "";
    }

    google.script.run

      .withSuccessHandler(function (respuesta) {
        if (!respuesta || !respuesta.success) {
          if (boton) {
            boton.disabled = false;
            boton.textContent = "CONFIRMAR Y GUARDAR";
          }

          if (mensaje) {
            mensaje.textContent =
              respuesta && respuesta.mensaje
                ? "⚠️ " + respuesta.mensaje
                : "⚠️ No fue posible guardar el vehículo.";

            mensaje.style.display = "block";
          }

          return;
        }

        /* CERRAR ADVERTENCIA */

        if (advertencia) {
          advertencia.style.display = "none";
        }

        /* LIMPIAR FORMULARIO */

        const campos = [
          "agregarVehiculoNombre",
          "agregarVehiculoPlaca",
          "agregarVehiculoTransito",
          "agregarVehiculoSoat",
          "agregarVehiculoTecnomecanica",
          "agregarVehiculoPicoYPlaca",
          "agregarVehiculoPrecio",
          "agregarVehiculoKilometraje",
          "agregarVehiculoDetalles",
          "agregarVehiculoUbicacion",
        ];

        campos.forEach(function (id) {
          const elemento = document.getElementById(id);

          if (elemento) {
            elemento.value = "";
          }
        });

        /* ACTUALIZAR VEHÍCULOS */

        cargarVehiculosAdministracion();

        /* MENSAJE FINAL */

        if (mensaje) {
          mensaje.textContent = "✓ Vehículo agregado correctamente.";

          mensaje.style.display = "block";
        }

        mostrarAlerta(
          "✅",
          "Vehículo agregado",
          "<p>El vehículo fue guardado correctamente.</p>",
        );
      })

      .withFailureHandler(function (error) {
        console.error("Error al crear vehículo:", error);

        if (boton) {
          boton.disabled = false;
          boton.textContent = "CONFIRMAR Y GUARDAR";
        }

        if (mensaje) {
          mensaje.textContent = "⚠️ Ocurrió un error al guardar el vehículo.";

          mensaje.style.display = "block";
        }
      })

      .crearVehiculoAdministracion(
        tokenSesion,

        datos.nombre,

        datos.placa,

        datos.transito,

        datos.soat,

        datos.tecnomecanica,

        datos.picoYPlaca,

        datos.precio,

        datos.kilometraje,

        datos.detalles,

        datos.ubicacion,
      );
  }

  function reproducirLottiesDelContenedor(contenedor) {
    if (!contenedor) {
      return;
    }

    const lotties = contenedor.querySelectorAll("lottie-player");

    lotties.forEach(function (lottie) {
      // Nunca permitir loop automático
      lottie.removeAttribute("loop");

      // Nunca depender de autoplay
      lottie.removeAttribute("autoplay");

      const reproducir = function () {
        try {
          lottie.stop();
          lottie.seek(0);
          lottie.play();
        } catch (error) {
          console.warn("No se pudo reproducir Lottie:", error);
        }
      };

      if (typeof lottie.play === "function") {
        reproducir();
      } else {
        lottie.addEventListener("ready", reproducir, {
          once: true,
        });
      }
    });
  }

  function animarContenedorVisible(contenedor) {
    if (!contenedor) {

  function convertirFechaCitaParaBackend(fecha) {
    if (!fecha) {
      return "";
    }

    const partes = fecha.split("-");

    if (partes.length !== 3) {
      return "";
    }

    return partes[2] + "/" + partes[1] + "/" + partes[0];
  }

  function guardarNuevaCita() {
    // ===================================================
    // VALIDAR ADMINISTRADOR
    // ===================================================

    const rol =
      usuarioPanel && usuarioPanel.rol
        ? usuarioPanel.rol.toString().trim().toUpperCase()
        : "";

    if (rol !== "ADMINISTRADOR" && rol !== "ADMIN") {
      alert("No tienes permisos para crear citas.");

      return;
    }

    // ===================================================
    // OBTENER CAMPOS
    // ===================================================

    const inputFecha = document.getElementById("citaFecha");

    const inputHora = document.getElementById("citaHora");

    const inputVehiculo = document.getElementById("citaVehiculo");

    const inputPlaca = document.getElementById("citaPlaca");

    const inputCliente = document.getElementById("citaCliente");

    const inputTelefono = document.getElementById("citaTelefono");

    const inputTipo = document.getElementById("citaTipo");

    const inputObservaciones = document.getElementById("citaObservaciones");

    if (!inputFecha || !inputHora || !inputVehiculo) {
      alert("No se encontraron los campos del formulario.");

      return;
    }

    // ===================================================
    // OBTENER VALORES
    // ===================================================

    const fechaOriginal = inputFecha.value.trim();

    const hora = inputHora.value.trim();

    const vehiculo = inputVehiculo.value.trim();

    const placa = inputPlaca ? inputPlaca.value.trim().toUpperCase() : "";

    const cliente = inputCliente ? inputCliente.value.trim() : "";

    const telefono = inputTelefono ? inputTelefono.value.trim() : "";

    const tipo = inputTipo ? inputTipo.value.trim() : "";

    const observaciones = inputObservaciones
      ? inputObservaciones.value.trim()
      : "";

    // ===================================================
    // CAMPOS OBLIGATORIOS
    // ===================================================

    if (!fechaOriginal) {
      alert("Debes seleccionar una fecha.");

      inputFecha.focus();

      return;
    }

    if (!hora) {
      alert("Debes seleccionar una hora.");

      inputHora.focus();

      return;
    }

    if (!vehiculo) {
      alert("Debes seleccionar un vehículo.");

    // ===================================================

    // ===================================================

      "Prueba de manejo",
      "Negociación",
      "Peritaje",
      "Recibir vehículo",
      "Otro",
    ];

    if (!tiposPermitidos.includes(tipo)) {
      alert("El tipo de cita no es válido.");

      return;

    // ===================================================
    // CONVERTIR FECHA
    // yyyy-MM-dd -> dd/MM/yyyy
    // ===================================================

    const fecha = convertirFechaCitaParaBackend(fechaOriginal);

    if (!fecha) {
      alert("La fecha seleccionada no es válida.");

    // ===================================================
    // BLOQUEAR BOTÓN
    // ===================================================

      ? formulario.querySelector(".editor-panel-boton")
      : null;

      botonGuardar.disabled = true;

      botonGuardar.textContent = "Guardando...";
    }

    // ===================================================
    // GUARDAR EN BACKEND
    // ===================================================

    if (modoEdicionCita && citaEditandoId) {
      google.script.run

        .withSuccessHandler(function (respuesta) {

            inputCliente.value = "";
          }

          if (inputTelefono) {
            inputTelefono.value = "";
          }

          if (inputTipo) {
            inputTipo.value = "";
          }

            inputObservaciones.value = "";

          );

          cargarCitasAdministracion();

          cargarAtencionRapidaCitas();
        })

        .withFailureHandler(function (error) {

            botonGuardar.disabled = false;

            botonGuardar.textContent = "Guardar cambios";

          console.error("Error actualizando cita:", error);

          cliente,

    } else {

        .withSuccessHandler(function (respuesta) {
          if (botonGuardar) {
            botonGuardar.disabled = false;

            botonGuardar.textContent = "Guardar cita";

  function buscarVehiculosParaCita() {
    const input = document.getElementById("citaVehiculo");

    const resultados = document.getElementById("resultadosVehiculosCita");

    if (!input || !resultados) {
      return;
    }

    const texto = input.value.trim().toLowerCase();

    if (!texto) {
      resultados.innerHTML = "";

      resultados.style.display = "none";

      return;
    }

    const coincidencias = vehiculosAdministracion
      .filter(function (vehiculo) {
        const nombre = String(vehiculo.nombre || "").toLowerCase();

        const placa = String(vehiculo.placa || "").toLowerCase();

        return nombre.includes(texto) || placa.includes(texto);
      })
      .slice(0, 8);

    if (coincidencias.length === 0) {
      resultados.innerHTML = `
      <div class="citas-buscador-vacio">
        No se encontraron vehículos.
      </div>
    `;

      resultados.style.display = "block";

      return;
    }

    resultados.innerHTML = "";

    coincidencias.forEach(function (vehiculo) {
      const opcion = document.createElement("button");

      opcion.type = "button";

      opcion.className = "citas-buscador-opcion";

      opcion.innerHTML = `
        <strong>
          ${vehiculo.nombre || "Vehículo"}
        </strong>

        <small>
          ${vehiculo.placa || ""}
        </small>
      `;

      opcion.onclick = function () {
        seleccionarVehiculoParaCita(vehiculo);
      };

      resultados.appendChild(opcion);
    });

    resultados.style.display = "block";
  }

  function seleccionarVehiculoParaCita(vehiculo) {
    const inputVehiculo = document.getElementById("citaVehiculo");

    const inputPlaca = document.getElementById("citaPlaca");

    const resultados = document.getElementById("resultadosVehiculosCita");

    if (inputVehiculo) {
      inputVehiculo.value = vehiculo.nombre || "";
    }

    if (inputPlaca) {
      inputPlaca.value = String(vehiculo.placa || "").toUpperCase();

    if (resultados) {
      resultados.innerHTML = "";

      resultados.style.display = "none";
    }

  function revisarAlertasCitas() {
    if (
      !Array.isArray(citasAdministracion) ||
      citasAdministracion.length === 0
    ) {
      return;
    }

    const ahora = Date.now();

    citasAdministracion.forEach(function (cita) {
      const estado = String(cita.estado || "")
        .trim()
        .toUpperCase();

      if (estado === "ATENDIDA" || estado === "CANCELADA") {
        return;
      }

      const fechaHora = obtenerFechaHoraCitaMs(cita);

      if (!fechaHora) {
        return;
      }

      const diferenciaMs = fechaHora - ahora;

      const minutos = Math.ceil(diferenciaMs / (1000 * 60));

      if (minutos < 0) {
        return;
      }

      const id = String(cita.id || "");

      if (!id) {
        return;
      }

      if (minutos <= 60 && minutos > 30) {
        const clave = id + "_60";

        if (!alertasCitasMostradas[clave]) {
          alertasCitasMostradas[clave] = true;

          mostrarAlertaInternaCita(cita, "Falta aproximadamente 1 hora");
        }
      } else if (minutos <= 30) {
        const clave = id + "_30";

        if (!alertasCitasMostradas[clave]) {
          alertasCitasMostradas[clave] = true;

          mostrarAlertaInternaCita(cita, "Faltan 30 minutos o menos");
        }
      }
    });
  }

  // =====================================================
  // CONVERTIR FECHA + HORA DE CITA
  // =====================================================

  function obtenerFechaHoraCitaMs(cita) {
    const fecha = String(cita.fecha || "").split("/");

    const hora = String(cita.hora || "").split(":");

    if (fecha.length !== 3 || hora.length !== 2) {
      return 0;
    }

    return new Date(
      Number(fecha[2]),
      Number(fecha[1]) - 1,
      Number(fecha[0]),
      Number(hora[0]),
      Number(hora[1]),
      0,
      0,
    ).getTime();
  }

      icono = "⚠️";
    } else if (tipo === "info") {
      icono = "ℹ️";

    mostrarAlerta(
      icono,
      titulo,
      `
      <div style="
        text-align:center;
        line-height:1.5;
        padding:4px 2px;
      ">

  function cambiarEstadoCitaFront(idCita, nuevoEstado) {
    if (!idCita || !nuevoEstado) {
      return;

    google.script.run

      .withSuccessHandler(function (respuesta) {
        if (!respuesta || !respuesta.success) {
          mostrarAlertaCitas(
            "error",

            respuesta && respuesta.mensaje
              ? respuesta.mensaje
              : "No fue posible actualizar la cita.",

        let mensajeEstado = "La cita fue actualizada correctamente.";

        if (nuevoEstado === "CONFIRMADA") {
          mensajeEstado = "La cita fue confirmada correctamente.";
        } else if (nuevoEstado === "ATENDIDA") {
          mensajeEstado = "La cita fue marcada como atendida.";
        } else if (nuevoEstado === "CANCELADA") {
          mensajeEstado = "La cita fue cancelada correctamente.";

        mostrarAlertaCitas("success", "Cita actualizada", mensajeEstado);

        cargarCitasAdministracion();

        mostrarAlertaCitas(
          "error",
          "Error",
          "Ocurrió un error al actualizar la cita.",

      .cambiarEstadoCitaAdministracion(tokenSesion, idCita, nuevoEstado);

  function eliminarCitaFront(idCita) {
    if (!idCita) {
      return;

    const cita = citasAdministracion.find(function (item) {
      return String(item.id || "") === String(idCita);

    const anterior = document.getElementById("modalEliminarCita");

    if (anterior) {
      anterior.remove();

    const modal = document.createElement("div");

    modal.id = "modalEliminarCita";

    modal.className = "modal-eliminar-cita";

    const vehiculo =
      cita && cita.vehiculo ? escaparHTML(cita.vehiculo) : "esta cita";

    modal.innerHTML = `
