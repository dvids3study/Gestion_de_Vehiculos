      boton.disabled = true;

      boton.textContent = "Eliminando...";
    }

    google.script.run

      .withSuccessHandler(function (respuesta) {
        if (!respuesta || !respuesta.success) {
          if (boton) {
            boton.disabled = false;

            boton.textContent = "Sí, eliminar";
          }

          mostrarAlertaCitas(
            "error",
            "No se pudo eliminar",
            respuesta && respuesta.mensaje
              ? respuesta.mensaje
              : "No fue posible eliminar la cita.",
          );

          return;
        }

        cerrarConfirmacionEliminarCita();

        mostrarAlertaCitas(
          "success",
          "Cita eliminada",
          respuesta.mensaje || "La cita fue eliminada correctamente.",
        );

        cargarCitasAdministracion();
      })

      .withFailureHandler(function (error) {
        console.error("Error eliminando cita:", error);

        if (boton) {
          boton.disabled = false;

          boton.textContent = "Sí, eliminar";
        }

        mostrarAlertaCitas(
          "error",
          "Error al eliminar",
          "Ocurrió un error al eliminar la cita.",
        );
      })

      .eliminarCitaAdministracion(tokenSesion, idCita);
  }

  // =====================================================
  // ACTUALIZAR LISTAS DE CITAS
  // =====================================================

  function actualizarListasCitasAdministracion() {
    const listaProximas = document.getElementById("listaCitasProximas");

    const listaAtrasadas = document.getElementById("listaCitasAtrasadas");

    const listaHistorial = document.getElementById("listaCitasHistorial");

    const totalProximas = document.getElementById("citasTotalProximas");

    const totalAtrasadas = document.getElementById("citasTotalAtrasadas");

    const ahora = Date.now();

    const proximas = [];
    const atrasadas = [];
    const historial = [];

    citasAdministracion.forEach(function (cita) {
      const estado = String(cita.estado || "")
        .trim()
        .toUpperCase();

      const fechaHora = obtenerFechaHoraCitaMs(cita);

      if (estado === "ATENDIDA" || estado === "CANCELADA") {
        historial.push(cita);

        return;
      }

      if (fechaHora > 0 && fechaHora < ahora) {
        atrasadas.push(cita);
      } else {
        proximas.push(cita);
      }
    });

    proximas.sort(function (a, b) {
      return obtenerFechaHoraCitaMs(a) - obtenerFechaHoraCitaMs(b);
    });

    atrasadas.sort(function (a, b) {
      return obtenerFechaHoraCitaMs(b) - obtenerFechaHoraCitaMs(a);
    });

    historial.sort(function (a, b) {
      return obtenerFechaHoraCitaMs(b) - obtenerFechaHoraCitaMs(a);
    });

    if (totalProximas) {
      totalProximas.textContent = proximas.length;
    }

    if (totalAtrasadas) {
      totalAtrasadas.textContent = atrasadas.length;
    }

    if (listaProximas) {
      listaProximas.innerHTML =
        proximas.length > 0
          ? proximas.map(crearTarjetaCita).join("")
          : `
          <div class="citas-lista-vacia">
            No hay citas próximas.
          </div>
        `;
    }

    if (listaAtrasadas) {
      listaAtrasadas.innerHTML =
        atrasadas.length > 0
          ? atrasadas.map(crearTarjetaCita).join("")
          : `
          <div class="citas-lista-vacia">
            No hay citas atrasadas.
          </div>
        `;
    }

    if (listaHistorial) {
      listaHistorial.innerHTML =
        historial.length > 0
          ? historial.map(crearTarjetaCita).join("")
          : `
          <div class="citas-lista-vacia">
            No hay citas en el historial.
          </div>
        `;
    }
  }

  function abrirEditarCita(idCita) {
    const cita = citasAdministracion.find(function (item) {
      return item.id === idCita;
    });

    if (!cita) {
      alert("No se encontró la cita.");

      return;
    }

    citaEditandoId = cita.id;

    modoEdicionCita = true;

    const contenido = document.getElementById("contenidoCitasAdministracion");

    const formulario = document.getElementById("formularioNuevaCita");

    if (contenido) {
      contenido.style.display = "none";
    }

    if (formulario) {
      formulario.style.display = "block";
    }

    const inputFecha = document.getElementById("citaFecha");

    const inputHora = document.getElementById("citaHora");

    const inputVehiculo = document.getElementById("citaVehiculo");

    const inputPlaca = document.getElementById("citaPlaca");

    const inputCliente = document.getElementById("citaCliente");

    const inputTelefono = document.getElementById("citaTelefono");

    const inputTipo = document.getElementById("citaTipo");

    const inputObservaciones = document.getElementById("citaObservaciones");

    if (inputFecha) {
      const partesFecha = String(cita.fecha || "").split("/");

      if (partesFecha.length === 3) {
        inputFecha.value =
          partesFecha[2] + "-" + partesFecha[1] + "-" + partesFecha[0];
      }
    }

    if (inputHora) {
      inputHora.value = cita.hora || "";
    }

    if (inputVehiculo) {
      inputVehiculo.value = cita.vehiculo || "";
    }

    if (inputPlaca) {
      inputPlaca.value = cita.placa || "";
    }

    if (inputCliente) {
      inputCliente.value = cita.cliente || "";
    }

    if (inputTelefono) {
      inputTelefono.value = cita.telefono || "";
    }

    if (inputTipo) {
      const tipo = String(cita.tipo || "")
        .trim()
        .toUpperCase();

      const mapaTipos = {
        "VER VEHÍCULO": "Ver vehículo",

        "PRUEBA DE MANEJO": "Prueba de manejo",

        NEGOCIACIÓN: "Negociación",

        PERITAJE: "Peritaje",

        "RECIBIR VEHÍCULO": "Recibir vehículo",

        OTRO: "Otro",
      };

      inputTipo.value = mapaTipos[tipo] || "";
    }

    if (inputObservaciones) {
      inputObservaciones.value = cita.observaciones || "";
    }

    const botonGuardar = formulario
      ? formulario.querySelector(".editor-panel-boton")
      : null;

    if (botonGuardar) {
      botonGuardar.textContent = "Guardar cambios";
    }

    window.scrollTo({
      top: 0,
      behavior: "smooth",
    });
  }

  function mostrarAlertaInternaCita(cita, mensaje) {
    const toast = document.getElementById("toastCita");

    const titulo = document.getElementById("toastCitaTitulo");

    const contenido = document.getElementById("toastCitaMensaje");

    if (!toast || !titulo || !contenido) {
      return;
    }

    const vehiculo = cita.vehiculo || "Vehículo";

    const placa = cita.placa || "";

    const fecha = cita.fecha || "";

    const hora = cita.hora || "";

    titulo.textContent = mensaje;

    contenido.textContent =
      vehiculo + (placa ? " · " + placa : "") + " · " + fecha + " · " + hora;

    toast.style.display = "flex";

    clearTimeout(toast._timeoutCita);

    toast._timeoutCita = setTimeout(function () {
      cerrarToastCita();
    }, 10000);
  }

  function cerrarToastCita() {
    const toast = document.getElementById("toastCita");

    if (!toast) {
      return;
    }

    toast.style.display = "none";

    clearTimeout(toast._timeoutCita);
  }

  function mostrarAlertaCitas(tipo, titulo, mensaje) {
    let icono = "📅";

    if (tipo === "success") {
      icono = "✅";
    } else if (tipo === "error") {
      icono = "⚠️";
    } else if (tipo === "info") {
      icono = "ℹ️";
    }

    mostrarAlerta(
      icono,
      titulo,
      `
      <div style="
        text-align:center;
        line-height:1.5;
        padding:4px 2px;
      ">
        ${escaparHTML(mensaje || "")}
      </div>
    `,
    );
  }

  function abrirAtencionRapidaCitas() {
    const rol =
      usuarioPanel && usuarioPanel.rol
        ? String(usuarioPanel.rol).trim().toUpperCase()
        : "";

    if (rol !== "ADMINISTRADOR" && rol !== "ADMIN") {
      return;
    }

    mostrarModuloPanel("moduloAtencionRapidaCitas");

    cargarDetalleAtencionRapidaCitas();

    console.log(
      "PRUEBA abrirAtencionRapidaCitas:",
      typeof abrirAtencionRapidaCitas,
    );
  }

  function cargarDetalleAtencionRapidaCitas() {
    const resumen = document.getElementById("citasRapidasDetalleResumen");

    const lista = document.getElementById("citasRapidasDetalleLista");

    if (!resumen || !lista) {
      return;
    }

    resumen.textContent = "Consultando citas...";

    lista.innerHTML = "";

    google.script.run

      .withSuccessHandler(function (respuesta) {
        if (
          !respuesta ||
          !respuesta.success ||
          !Array.isArray(respuesta.citas)
        ) {
          resumen.textContent = "No fue posible consultar las citas.";

          return;
        }

        const ahora = new Date();

        const dia = String(ahora.getDate()).padStart(2, "0");

        const mes = String(ahora.getMonth() + 1).padStart(2, "0");

        const anio = ahora.getFullYear();

        const fechaHoy = dia + "/" + mes + "/" + anio;

        const ahoraMs = Date.now();

        const citasActivas = respuesta.citas.filter(function (cita) {
          const estado = String(cita.estado || "")
            .trim()
            .toUpperCase();

          return estado !== "ATENDIDA" && estado !== "CANCELADA";
        });

        /* ==========================================
              PRÓXIMAS DE HOY
            ========================================== */

        const citasProximasHoy = citasActivas
          .filter(function (cita) {
            const fechaHora = obtenerFechaHoraCitaMs(cita);

            return (
              String(cita.fecha || "").trim() === fechaHoy &&
              fechaHora >= ahoraMs
            );
          })
          .sort(function (a, b) {
            return obtenerFechaHoraCitaMs(a) - obtenerFechaHoraCitaMs(b);
          });

        /* ==========================================
              ATRASADAS
            ========================================== */

        const citasAtrasadas = citasActivas
          .filter(function (cita) {
            const fechaHora = obtenerFechaHoraCitaMs(cita);

            return fechaHora > 0 && fechaHora < ahoraMs;
          })
          .sort(function (a, b) {
            return obtenerFechaHoraCitaMs(b) - obtenerFechaHoraCitaMs(a);
          });

        /* ==========================================
              PRÓXIMAS FECHAS
            ========================================== */

        const citasFuturas = citasActivas
          .filter(function (cita) {
            const fechaHora = obtenerFechaHoraCitaMs(cita);

            return (
              String(cita.fecha || "").trim() !== fechaHoy &&
              fechaHora >= ahoraMs
            );
          })
          .sort(function (a, b) {
            return obtenerFechaHoraCitaMs(a) - obtenerFechaHoraCitaMs(b);
          });

        const totalCitas =
          citasProximasHoy.length + citasAtrasadas.length + citasFuturas.length;

        if (totalCitas === 0) {
          resumen.textContent = "No hay citas pendientes.";

          lista.innerHTML = `
                <div class="citas-lista-vacia">
                  No hay citas para mostrar.
                </div>
              `;

          return;
        }

        resumen.textContent =
          totalCitas === 1
            ? "1 cita pendiente"
            : totalCitas + " citas pendientes";

        function crearTarjetaCitaRapida(cita, etiquetaTiempo) {
          return `
                <article class="cita-rapida-detalle-card">

                  <div class="cita-rapida-detalle-hora-bloque">

                    <div class="cita-rapida-detalle-hora">
                      ${escaparHTML(cita.hora || "")}
                    </div>

                    <div class="cita-rapida-detalle-hora-sub">
                      ${escaparHTML(etiquetaTiempo)}
                    </div>

                  </div>


                  <div class="cita-rapida-detalle-info">

                    <strong class="cita-rapida-detalle-titulo">
                      ${escaparHTML(cita.vehiculo || "Vehículo")}
                    </strong>


                    <div class="cita-rapida-detalle-grid">

                      <div class="cita-rapida-dato">
                        <span class="cita-rapida-label">
                          Fecha
                        </span>

                        <span class="cita-rapida-value">
                          ${escaparHTML(cita.fecha || "-")}
                        </span>
                      </div>


                      <div class="cita-rapida-dato">
                        <span class="cita-rapida-label">
                          Placa
                        </span>

                        <span class="cita-rapida-value">
                          ${escaparHTML(cita.placa || "-")}
                        </span>
                      </div>


                      <div class="cita-rapida-dato">
                        <span class="cita-rapida-label">
                          Cliente
                        </span>

                        <span class="cita-rapida-value">
                          ${escaparHTML(cita.cliente || "Sin cliente")}
                        </span>
                      </div>


                      <div class="cita-rapida-dato">
                        <span class="cita-rapida-label">
                          Teléfono
                        </span>

                        <span class="cita-rapida-value">
                          ${escaparHTML(cita.telefono || "Sin teléfono")}
                        </span>
                      </div>


                      <div class="cita-rapida-dato">
                        <span class="cita-rapida-label">
                          Tipo
                        </span>

                        <span class="cita-rapida-value">
                          ${escaparHTML(cita.tipo || "Sin tipo")}
                        </span>
                      </div>


                      <div class="cita-rapida-dato cita-rapida-dato-estado">
                        <span class="cita-rapida-label">
                          Estado
                        </span>

                        <span class="cita-rapida-value cita-rapida-estado">
                          ${escaparHTML(cita.estado || "PENDIENTE")}
                        </span>
                      </div>

                    </div>

                  </div>

                </article>
              `;
        }

        let html = "";

        /* PRÓXIMAS HOY */

        if (citasProximasHoy.length > 0) {
          html += `
                <div class="citas-rapidas-seccion">

                  <div class="citas-rapidas-seccion-titulo">
                    <strong>PRÓXIMAS DE HOY</strong>
                    <span>
                      ${citasProximasHoy.length}
                    </span>
                  </div>

                  ${citasProximasHoy
                    .map(function (cita) {
                      return crearTarjetaCitaRapida(cita, "HOY");
                    })
                    .join("")}

                </div>
              `;
        }

        /* ATRASADAS */

        if (citasAtrasadas.length > 0) {
          html += `
                <div class="citas-rapidas-seccion citas-rapidas-seccion-atrasadas">

                  <div class="citas-rapidas-seccion-titulo">
                    <strong>ATRASADAS</strong>
                    <span>
                      ${citasAtrasadas.length}
                    </span>
                  </div>

                  ${citasAtrasadas
                    .map(function (cita) {
                      return crearTarjetaCitaRapida(cita, "ATRASADA");
                    })
                    .join("")}

                </div>
              `;
        }

        /* PRÓXIMAS FECHAS */

        if (citasFuturas.length > 0) {
          html += `
                <div class="citas-rapidas-seccion">

                  <div class="citas-rapidas-seccion-titulo">
                    <strong>PRÓXIMAS FECHAS</strong>
                    <span>
                      ${citasFuturas.length}
                    </span>
                  </div>

                  ${citasFuturas
                    .map(function (cita) {
                      return crearTarjetaCitaRapida(
                        cita,
                        cita.fecha || "PRÓXIMA",
                      );
                    })
                    .join("")}

                </div>
              `;
        }

        lista.innerHTML = html;
      })

      .withFailureHandler(function (error) {
        console.error("Error cargando detalle de citas:", error);

        resumen.textContent = "No fue posible consultar las citas.";
      })

      .obtenerCitasAdministracion(tokenSesion);
  }
</script>
