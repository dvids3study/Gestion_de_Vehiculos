<style>
  input,
  textarea,
  select {
    font-size: 16px;
  }

  /* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
  }

  html {
    overflow-x: hidden;
  }

  body {
    width: 100%;
    min-height: 100vh;

    overflow-y: clip;
    overflow-x: hidden;

    /* ==========================================================
     FONDO DE LA APLICACIÓN
     ========================================================== */

    background-image: url("https://drive.google.com/thumbnail?id=1O7oQy4KciGKFlYoJjlamjrKyF_XNu41e&sz=w2000");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
      sans-serif;

    color: #1c1c1e;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  /* =====================================================
   APLICACIÓN
===================================================== */

  .app {
    width: 100%;
    min-height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 70px 18px 20px;

    margin: 0;
  }

  /* =====================================================
   ENCABEZADO
===================================================== */

  .header {
    width: 100%;
    max-width: 520px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    margin: 0 0 22px 0;
  }

  /* =====================================================
   LOGO
===================================================== */

  .logo-container {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin: 0 0 10px 0;

    position: relative;
    z-index: 1;
  }

  .logo {
    display: block;

    width: 300px;
    max-width: 85vw;

    aspect-ratio: 16 / 9;

    object-fit: contain;

    margin: 0;

    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.08));
  }

  /* =====================================================
   SUBTÍTULO
===================================================== */

  .subtitulo {
    margin: 0;

    font-size: 17px;
    line-height: 1.35;

    font-weight: 400;
    letter-spacing: -0.01em;

    color: #8e8e93;
  }

  /* =====================================================
   PANEL PRINCIPAL
   LIQUID GLASS
===================================================== */

  .panel {
    width: 100%;
    max-width: 520px;

    padding: 18px;

    /*
    Vidrio translúcido.
    Se bajó ligeramente la opacidad para que
    el contenido del fondo pueda atravesarlo.
  */
    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.68),
      rgba(255, 255, 255, 0.42)
    );

    /*
    ESTA ES LA PARTE IMPORTANTE DEL EFECTO.
  */
    backdrop-filter: blur(30px) saturate(180%) contrast(105%);

    -webkit-backdrop-filter: blur(30px) saturate(180%) contrast(105%);

    /*
    Borde exterior del cristal.
  */
    border: 1px solid rgba(255, 255, 255, 0.85);

    border-radius: 28px;

    /*
    Profundidad + reflejos internos.
  */
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.1),
      0 8px 20px rgba(0, 0, 0, 0.05),
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 0 rgba(255, 255, 255, 0.3);

    position: relative;

    overflow: hidden;

    /*
    Permite crear correctamente las capas
    visuales del vidrio.
  */
    isolation: isolate;
  }

  /* =====================================================
   REFLEJO SUPERIOR DEL CRISTAL
===================================================== */

  .panel::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 55%;

    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.55) 0%,
      rgba(255, 255, 255, 0.2) 45%,
      rgba(255, 255, 255, 0) 100%
    );

    pointer-events: none;

    z-index: -1;
  }

  /* =====================================================
   BRILLO LATERAL
===================================================== */

  .panel::after {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 35%;
    height: 100%;

    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.22),
      rgba(255, 255, 255, 0)
    );

    pointer-events: none;

    z-index: -1;
  }

  /* =====================================================
   BUSCADOR
===================================================== */

  .input {
    display: block;

    width: 100%;
    height: 56px;

    padding: 0 16px 0 45px;

    border: 1px solid rgba(60, 60, 67, 0.1);

    border-radius: 16px;

    /*
    Vidrio interno.
  */
    background: rgba(255, 255, 255, 0.38);

    color: #1c1c1e;

    font-family: inherit;

    font-size: 17px;
    font-weight: 400;

    outline: none;

    appearance: none;
    -webkit-appearance: none;

    box-shadow:
      inset 0 1px 2px rgba(255, 255, 255, 0.75),
      inset 0 -1px 2px rgba(0, 0, 0, 0.025),
      0 1px 5px rgba(0, 0, 0, 0.035);

    backdrop-filter: blur(16px) saturate(170%);

    -webkit-backdrop-filter: blur(16px) saturate(170%);

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.15s ease;
  }

  .input::placeholder {
    color: #8e8e93;

    opacity: 1;
  }

  .input:focus {
    background: rgba(255, 255, 255, 0.62);

    border-color: rgba(60, 60, 67, 0.18);

    box-shadow:
      0 0 0 3px rgba(0, 0, 0, 0.045),
      0 6px 18px rgba(0, 0, 0, 0.06),
      inset 0 1px 2px rgba(255, 255, 255, 0.8);
  }

  /* =====================================================
   BOTONES
===================================================== */

  .botones {
    position: relative;

    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 10px;

    margin-top: 12px;

    z-index: 2;
  }

  .btn {
    width: 100%;

    height: 50px;

    border: none;

    border-radius: 15px;

    font-family: inherit;

    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 0 14px;

    transition:
      transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
      background 0.18s ease,
      box-shadow 0.18s ease,
      opacity 0.15s ease;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;
  }

  .btn:active {
    transform: scale(0.96);
    transition: none;
  }

  /* =====================================================
   BOTÓN CIRCULACIÓN
===================================================== */

  .btn-circular {
    background: linear-gradient(135deg, #97d2ec, #0680d5);

    color: #ffffff;

    box-shadow:
      0 5px 14px rgba(53, 126, 227, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .btn-circular:hover {
    background: linear-gradient(135deg, #4088e8, #357ee3);

    box-shadow:
      0 8px 20px rgba(53, 126, 227, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }

  .btn-circular:active {
    background: #286fd2;
  }

  /* =====================================================
   BOTÓN INFORMACIÓN
===================================================== */

  .btn-info {
    background: linear-gradient(135deg, #97d2ec, #0680d5);

    color: #ffffff;

    box-shadow:
      0 5px 14px rgba(53, 126, 227, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .btn-info:hover {
    background: linear-gradient(135deg, #4088e8, #357ee3);

    box-shadow:
      0 8px 20px rgba(53, 126, 227, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }

  .btn-info:active {
    background: #286fd2;
  }

  /* =====================================================
   FOOTER
===================================================== */

  .footer {
    width: 100%;
    max-width: 520px;

    text-align: center;

    margin-top: 20px;

    color: #8e8e93;

    font-size: 12px;

    line-height: 1.5;
  }

  /* =====================================================
   MODAL
===================================================== */
  /* =====================================================
   MODAL
===================================================== */

  .modal {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100dvh;

    background: rgba(0, 0, 0, 0.38);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    z-index: 9999;

    backdrop-filter: blur(14px) saturate(120%);

    -webkit-backdrop-filter: blur(14px) saturate(120%);

    /* IMPIDE QUE EL SCROLL SE PROPAGUE AL FONDO */
    overflow: hidden;

    overscroll-behavior: contain;

    touch-action: none;
  }

  .modal.activo {
    display: flex;
  }

  /* =====================================================
   TARJETA DE ALERTA
===================================================== */

  .alerta {
    width: 100%;
    max-width: 520px;

    max-height: 88vh;

    overflow-y: auto;

    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.88),
      rgba(255, 255, 255, 0.76)
    );

    border: 1px solid rgba(255, 255, 255, 0.88);

    border-radius: 25px;

    padding: 24px 20px 20px;

    box-shadow:
      0 25px 70px rgba(0, 0, 0, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);

    backdrop-filter: blur(30px) saturate(180%);

    -webkit-backdrop-filter: blur(30px) saturate(180%);

    animation: aparecer 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes aparecer {
    from {
      opacity: 0;

      transform: scale(0.94) translateY(8px);
    }

    to {
      opacity: 1;

      transform: scale(1) translateY(0);
    }
  }

  /* =====================================================
   ICONO ALERTA
===================================================== */

  .alerta-icono {
    text-align: center;

    font-size: 58px;

    line-height: 1;

    margin-bottom: 10px;
  }

  .alerta-titulo {
    text-align: center;

    font-size: 22px;

    font-weight: 800;
    letter-spacing: -0.02em;

    line-height: 1.2;

    margin-bottom: 22px;
  }

  .alerta-contenido {
    width: 100%;

    font-size: 16px;

    line-height: 1.55;

    color: #333;

    white-space: normal;

    overflow-wrap: anywhere;
  }

  .fila {
    margin-bottom: 16px;
  }

  .fila:last-child {
    margin-bottom: 0;
  }

  .fila-titulo {
    font-weight: 700;

    margin-bottom: 4px;
  }

  .resultado {
    font-size: 17px;

    font-weight: 700;

    line-height: 1.4;

    margin-bottom: 18px;
  }

  .resultado.si {
    color: #159447;
  }

  .resultado.no {
    color: #d71920;
  }

  .motivo {
    background: rgba(255, 248, 223, 0.82);

    border-radius: 13px;

    padding: 12px;

    margin-bottom: 18px;

    color: #333;

    border: 1px solid rgba(255, 220, 100, 0.25);
  }

  /* =====================================================
   BOTÓN CERRAR
===================================================== */

  .btn-cerrar {
    width: 100%;

    height: 54px;

    margin-top: 20px;

    border: none;

    border-radius: 15px;

    background: linear-gradient(135deg, #2c2c2e, #1c1c1e);

    color: #ffffff;

    font-family: inherit;

    font-size: 17px;

    font-weight: 700;

    letter-spacing: -0.01em;

    cursor: pointer;

    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.15);

    transition:
      transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
      background 0.15s ease;
  }

  .btn-cerrar:hover {
    background: linear-gradient(135deg, #3a3a3c, #2c2c2e);
  }

  .btn-cerrar:active {
    transform: scale(0.97);

    transition: none;
  }

  /* =====================================================
   LOADING
===================================================== */

  .loading {
    position: fixed;

    inset: 0;

    background: rgba(255, 255, 255, 0.58);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 10000;

    backdrop-filter: blur(14px);

    -webkit-backdrop-filter: blur(14px);
  }

  .loading.activo {
    display: flex;
  }

  .spinner {
    width: 45px;
    height: 45px;

    border: 4px solid rgba(0, 0, 0, 0.08);

    border-top-color: #1c1c1e;

    border-radius: 50%;

    animation: girar 0.8s linear infinite;
  }

  @keyframes girar {
    to {
      transform: rotate(360deg);
    }
  }

  /* =====================================================
   ÚLTIMAS BÚSQUEDAS
===================================================== */

  .historial {
    width: 100%;

    max-width: 520px;

    margin: 24px auto 0;
  }

  /* =====================================================
   ENCABEZADO
===================================================== */

  .historial-encabezado {
    padding: 0 5px;

    margin-bottom: 10px;
  }

  .historial-titulo {
    margin: 0;

    font-size: 17px;

    font-weight: 800;

    color: #1c1c1e;

    letter-spacing: -0.02em;

    text-align: left;
  }

  .historial-subtitulo {
    margin-top: 2px;

    font-size: 12px;

    font-weight: 400;

    color: #8e8e93;

    text-align: left;
  }

  /* =====================================================
   CONTENEDOR
===================================================== */

  .historial-lista {
    width: 100%;

    overflow: hidden;

    border-radius: 21px;

    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.72),
      rgba(255, 255, 255, 0.42)
    );

    border: 1px solid rgba(255, 255, 255, 0.85);

    box-shadow:
      0 12px 32px rgba(0, 0, 0, 0.07),
      0 3px 10px rgba(0, 0, 0, 0.025),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);

    backdrop-filter: blur(24px) saturate(180%);

    -webkit-backdrop-filter: blur(24px) saturate(180%);

    text-align: center;
  }

  /* =====================================================
   FILA
===================================================== */

  .historial-item {
    position: relative;

    width: 100%;

    min-height: 68px;

    display: flex;

    align-items: center;

    padding: 10px 14px;

    background: transparent;

    border: none;

    color: #1c1c1e;

    font-family: inherit;

    text-align: left;

    cursor: pointer;

    transition:
      background 0.18s ease,
      transform 0.15s ease;
  }

  /* =====================================================
   SEPARADOR
===================================================== */

  .historial-item + .historial-item {
    border-top: 1px solid rgba(60, 60, 67, 0.07);
  }

  /* =====================================================
   ICONO
===================================================== */

  .historial-icono {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-right: 11px;

    border-radius: 13px;

    font-size: 20px;

    background: linear-gradient(
      135deg,
      rgba(151, 210, 236, 0.35),
      rgba(6, 128, 213, 0.12)
    );

    border: 1px solid rgba(6, 128, 213, 0.08);

    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
  }

  /* =====================================================
   CONTENIDO
===================================================== */

  .historial-contenido {
    min-width: 0;

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;
  }

  .historial-texto {
    display: block;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 15px;

    font-weight: 700;

    line-height: 1.25;

    color: #1c1c1e;
  }

  .historial-tiempo {
    display: block;

    margin-top: 3px;

    font-size: 11px;

    line-height: 1.2;

    color: #8e8e93;

    font-weight: 400;
  }

  /* =====================================================
   FLECHA
===================================================== */

  .historial-flecha {
    flex-shrink: 0;

    margin-left: 10px;

    color: #0680d5;

    font-size: 27px;

    line-height: 1;

    font-weight: 300;
  }

  /* =====================================================
   INTERACCIÓN
===================================================== */

  .historial-item:hover {
    background: rgba(255, 255, 255, 0.42);
  }

  .historial-item:active {
    background: rgba(151, 210, 236, 0.18);

    transform: scale(0.995);

    transition: none;
  }

  /* =====================================================
   HISTORIAL VACÍO
===================================================== */

  .historial-vacio {
    min-height: 65px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 15px;

    color: #8e8e93;

    font-size: 13px;

    text-align: center;
  }

  .pie-pagina {
    width: 100%;
    text-align: center;

    margin-top: 30px;
    padding-bottom: 12px;

    font-size: 10px;
    font-weight: 500;

    color: #a1a1a6;

    letter-spacing: 0.02em;
  }

  /* =====================================================
   OPCIONES PRINCIPALES
===================================================== */

  .opciones {
    position: relative;

    width: 100%;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-top: 12px;

    z-index: 2;
  }

  /* =====================================================
   TARJETA DE OPCIÓN
===================================================== */

  .opcion {
    position: relative;

    width: 100%;
    min-height: 145px;

    padding: 18px;

    border: 1px solid rgba(255, 255, 255, 0.8);

    border-radius: 35px;

    font-family: inherit;

    text-align: left;

    cursor: pointer;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    justify-content: flex-start;

    overflow: hidden;

    transition:
      transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.2s ease,
      background 0.2s ease;

    box-shadow:
      0 8px 22px rgba(0, 0, 0, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  /* =====================================================
   REFLEJO
===================================================== */

  .opcion::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 55%;

    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.3),
      rgba(255, 255, 255, 0)
    );

    pointer-events: none;
  }

  /* =====================================================
   OPCIÓN CIRCULACIÓN
===================================================== */

  .opcion-circular {
    background: linear-gradient(
      145deg,
      rgba(151, 210, 236, 0.88),
      rgba(6, 128, 213, 0.92)
    );

    color: #1c1c1e;

    box-shadow:
      0 10px 25px rgba(6, 128, 213, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  /* =====================================================
   OPCIÓN INFORMACIÓN
===================================================== */

  .opcion-info {
    background: linear-gradient(
      145deg,
      rgba(151, 210, 236, 0.88),
      rgba(6, 128, 213, 0.92)
    );

    color: #1c1c1e;
  }

  /* =====================================================
   ICONO
===================================================== */

  .opcion-icono {
    position: relative;

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 12px;

    border-radius: 13px;

    font-size: 23px;

    background: rgba(255, 255, 255, 0.22);

    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  /* =====================================================
   CONTENIDO
===================================================== */

  .opcion-contenido {
    position: relative;

    width: 100%;

    padding-right: 15px;
  }

  .opcion-titulo {
    font-size: 17px;

    line-height: 1.2;

    font-weight: 800;

    letter-spacing: -0.02em;

    margin-bottom: 6px;
  }

  .opcion-descripcion {
    font-size: 12px;

    line-height: 1.4;

    font-weight: 400;

    opacity: 0.88;
  }

  /* =====================================================
   FLECHA
===================================================== */

  .opcion-flecha {
    position: absolute;

    right: 14px;
    bottom: 12px;

    font-size: 25px;

    line-height: 1;

    opacity: 0.75;
  }

  /* =====================================================
   INTERACCIÓN
===================================================== */

  .opcion:hover {
    transform: translateY(-2px);

    box-shadow:
      0 14px 30px rgba(0, 0, 0, 0.11),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }

  .opcion:active {
    transform: scale(0.97);

    transition: none;
  }

  /* =====================================================
   INFORMACIÓN INFERIOR
===================================================== */

  .info-inferior {
    width: 100%;
    max-width: 500px;

    min-height: 80px;

    margin: 18px auto 0;

    padding: 20px 24px;

    display: flex;
    align-items: center;

    border-radius: 32px 32px 0 0;

    background: linear-gradient(135deg, #1764d8, #0645b8);

    color: #ffffff;

    box-shadow:
      0 -5px 20px rgba(6, 70, 180, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);

    position: relative;

    overflow: hidden;

    height: 10px;
  }

  /* Brillo decorativo */

  .info-inferior::before {
    content: "";

    position: absolute;

    width: 280px;
    height: 280px;

    right: -80px;
    bottom: -190px;

    border: 1px solid rgba(255, 255, 255, 0.18);

    border-radius: 50%;

    box-shadow:
      0 0 0 25px rgba(255, 255, 255, 0.04),
      0 0 0 50px rgba(255, 255, 255, 0.03),
      0 0 0 75px rgba(255, 255, 255, 0.02);

    pointer-events: none;
  }

  /* =====================================================
   ICONO
===================================================== */
  .info-inferior-icono {
    width: 55px;

    height: 55px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-right: 17px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.15);

    border: 1px solid rgba(255, 255, 255, 0.25);

    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);

    font-size: 30px;

    position: relative;

    z-index: 1;
  }

  /* =====================================================
   ESCUDO SVG
===================================================== */

  .info-inferior-icono svg {
    width: 36px;

    height: 36px;

    display: block;

    flex-shrink: 0;
  }
