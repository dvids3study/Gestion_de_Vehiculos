    color: #9aabba;
  }

  #gestionParqueaderos #nuevoParqueaderoGestion:focus {
    border-color: rgba(20, 126, 234, 0.38);

    background: #ffffff;

    box-shadow: 0 0 0 4px rgba(20, 126, 234, 0.07);
  }

  #gestionParqueaderos .formulario-parqueadero button {
    flex: 0 0 auto;

    min-height: 46px;

    padding: 0 15px;

    border: 0;
    border-radius: 14px;

    background: linear-gradient(135deg, #147eea, #16b8e8);

    color: #ffffff;

    font-family: inherit;

    font-size: 11px;
    font-weight: 800;

    white-space: nowrap;

    box-shadow: 0 7px 16px rgba(20, 126, 234, 0.18);

    cursor: pointer;

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease;
  }

  #gestionParqueaderos .formulario-parqueadero button:hover {
    transform: translateY(-1px);

    box-shadow: 0 10px 20px rgba(20, 126, 234, 0.23);
  }

  #gestionParqueaderos .formulario-parqueadero button:active {
    transform: scale(0.97);
  }

  /* -----------------------------------------------------
   LISTA DE PARQUEADEROS
----------------------------------------------------- */

  #gestionParqueaderos .lista-vehiculos-panel {
    display: flex;
    flex-direction: column;

    gap: 10px;
  }

  #gestionParqueaderos .vehiculo-panel-card {
    min-height: 72px;

    padding: 12px 14px;

    border-radius: 18px;

    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.88),
      rgba(231, 245, 255, 0.7)
    );

    box-shadow:
      0 7px 20px rgba(40, 100, 150, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.92);

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease,
      border-color 0.2s ease;
  }

  #gestionParqueaderos .vehiculo-panel-card:hover {
    transform: translateY(-2px);

    border-color: rgba(65, 164, 232, 0.24);

    box-shadow:
      0 11px 25px rgba(40, 100, 150, 0.11),
      inset 0 1px 0 rgba(255, 255, 255, 0.96);
  }

  #gestionParqueaderos .vehiculo-panel-info h3 {
    margin: 0 0 5px;

    color: #1d4568;

    font-size: 15px;
    font-weight: 800;

    letter-spacing: 0.2px;
  }

  #gestionParqueaderos .vehiculo-panel-placa {
    display: inline-flex;
    align-items: center;

    min-height: 21px;

    margin: 0;
    padding: 2px 8px;

    border-radius: 999px;

    background: rgba(20, 126, 234, 0.08);

    color: #5d7d99;

    font-size: 9px;
    font-weight: 800;

    letter-spacing: 0.8px;
  }

  /* -----------------------------------------------------
   ACCIONES
----------------------------------------------------- */

  #gestionParqueaderos .vehiculo-panel-acciones {
    display: flex;
    align-items: center;

    gap: 8px;

    flex-shrink: 0;
  }

  #gestionParqueaderos .vehiculo-panel-boton {
    min-height: 36px;

    padding: 0 13px;

    border-radius: 12px;

    font-size: 10px;
  }

  #gestionParqueaderos .vehiculo-panel-boton:first-child {
    background: linear-gradient(135deg, #147eea, #16b8e8);
  }

  #gestionParqueaderos .vehiculo-panel-boton:last-child {
    background: rgba(20, 126, 234, 0.09);

    color: #2878ba;

    box-shadow: none;

    border: 1px solid rgba(20, 126, 234, 0.12);
  }

  #gestionParqueaderos .vehiculo-panel-boton:last-child:hover {
    background: rgba(20, 126, 234, 0.14);

    box-shadow: 0 7px 15px rgba(20, 126, 234, 0.1);
  }

  /* -----------------------------------------------------
   ESTADO VACÍO / CARGA DEL MÓDULO
----------------------------------------------------- */

  #gestionParqueaderos .gestion-vacio {
    width: 100%;

    padding: 22px 16px;

    border: 1px dashed rgba(66, 143, 194, 0.22);

    border-radius: 17px;

    background: rgba(255, 255, 255, 0.42);

    color: #7892a9;

    font-size: 11px;

    text-align: center;

    box-sizing: border-box;
  }

  /* =====================================================
   HISTORIAL DE MOVIMIENTOS
   PANEL ADMINISTRATIVO
===================================================== */

  .lista-historial-panel {
    width: 100%;
  }

  /* =====================================================
   CONTENEDOR PRINCIPAL
===================================================== */

  .historial-panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* =====================================================
   BUSCADOR
===================================================== */

  .historial-buscador {
    width: 100%;
    min-height: 58px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 0 16px;

    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.92),
      rgba(239, 248, 255, 0.86)
    );

    border: 1px solid rgba(89, 168, 255, 0.16);

    border-radius: 18px;

    box-shadow: 0 8px 24px rgba(40, 118, 194, 0.08);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    box-sizing: border-box;
  }

  .historial-buscador:focus-within {
    border-color: rgba(0, 153, 255, 0.35);

    box-shadow: 0 10px 28px rgba(0, 132, 255, 0.12);
  }

  .historial-buscador-icono {
    flex: 0 0 auto;

    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: linear-gradient(
      135deg,
      rgba(0, 174, 255, 0.13),
      rgba(38, 109, 255, 0.1)
    );

    font-size: 18px;
  }

  .historial-buscador input {
    flex: 1;

    width: 100%;

    border: 0;
    outline: none;

    background: transparent;

    color: #18344f;

    font-size: 15px;

    font-weight: 500;

    font-family: inherit;

    min-width: 0;
  }

  .historial-buscador input::placeholder {
    color: #91a5b8;
  }

  .historial-buscador-limpiar {
    flex: 0 0 auto;

    width: 32px;
    height: 32px;

    border: 0;

    border-radius: 10px;

    background: rgba(37, 112, 191, 0.08);

    color: #52708c;

    align-items: center;

    justify-content: center;

    font-size: 21px;

    line-height: 1;

    cursor: pointer;

    transition:
      transform 0.18s ease,
      background 0.18s ease;
  }

  .historial-buscador-limpiar:hover {
    background: rgba(37, 112, 191, 0.14);

    transform: scale(1.04);
  }

  /* =====================================================
   CATEGORÍAS
===================================================== */

  .historial-categorias {
    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 16px;
  }

  .historial-categoria {
    width: 100%;

    min-height: 112px;

    display: grid;

    grid-template-columns: 52px minmax(0, 1fr) 20px;

    align-items: center;

    gap: 13px;

    padding: 18px;

    border: 1px solid rgba(92, 164, 224, 0.13);

    border-radius: 20px;

    background: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.96),
      rgba(238, 247, 255, 0.9)
    );

    box-shadow: 0 8px 24px rgba(35, 112, 174, 0.07);

    cursor: pointer;

    text-align: left;

    font-family: inherit;

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease,
      border-color 0.2s ease,
      background 0.2s ease;
  }

  .historial-categoria:hover {
    transform: translateY(-2px);

    box-shadow: 0 12px 28px rgba(35, 112, 174, 0.11);

    border-color: rgba(0, 153, 255, 0.24);
  }

  .historial-categoria:active {
    transform: scale(0.985);
  }

  .historial-categoria.activo {
    border-color: rgba(0, 143, 255, 0.34);

    background: linear-gradient(
      145deg,
      rgba(236, 249, 255, 0.98),
      rgba(229, 242, 255, 0.95)
    );

    box-shadow: 0 12px 30px rgba(0, 143, 255, 0.11);
  }

  .historial-categoria-icono {
    width: 52px;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 16px;

    background: linear-gradient(
      135deg,
      rgba(0, 174, 255, 0.14),
      rgba(38, 109, 255, 0.1)
    );

    font-size: 24px;

    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
  }

  .historial-categoria-texto {
    min-width: 0;

    display: flex;

    flex-direction: column;

    gap: 5px;
  }

  .historial-categoria-texto strong {
    color: #173b5d;

    font-size: 15px;

    line-height: 1.25;

    font-weight: 700;
  }

  .historial-categoria-texto span {
    color: #7890a6;

    font-size: 12px;

    line-height: 1.4;

    font-weight: 500;
  }

  .historial-categoria-flecha {
    color: #7fa0ba;

    font-size: 26px;

    line-height: 1;

    text-align: right;
  }

  /* =====================================================
   RESULTADOS
===================================================== */

  .historial-resultados {
    width: 100%;
  }

  .historial-resultados-encabezado {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 12px;

    margin-bottom: 12px;
  }

  .historial-resultados-encabezado strong {
    color: #183c5b;

    font-size: 15px;
  }

  .historial-resultados-encabezado span {
    color: #7b95aa;

    font-size: 12px;

    text-align: right;
  }

  /* =====================================================
   LISTA DE MOVIMIENTOS
===================================================== */

  .historial-listado {
    display: flex;

    flex-direction: column;

    gap: 12px;
  }

  /* =====================================================
   TARJETA DE MOVIMIENTO
===================================================== */

  .historial-movimiento-card {
    width: 100%;

    display: grid;

    grid-template-columns: 50px minmax(0, 1fr) 34px;

    align-items: center;

    gap: 13px;

    padding: 15px;

    border: 1px solid rgba(81, 154, 215, 0.13);

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.93);

    box-shadow: 0 7px 22px rgba(39, 113, 176, 0.065);

    box-sizing: border-box;

    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease;
  }

  .historial-movimiento-card:hover {
    transform: translateY(-1px);

    box-shadow: 0 10px 25px rgba(39, 113, 176, 0.1);
  }

  .historial-movimiento-icono {
    width: 50px;

    height: 50px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 15px;

    background: linear-gradient(
      135deg,
      rgba(0, 168, 255, 0.12),
      rgba(50, 110, 255, 0.09)
    );

    font-size: 23px;
  }

  .historial-movimiento-contenido {
    min-width: 0;

    display: flex;

    flex-direction: column;

    gap: 5px;
  }

  .historial-movimiento-superior {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 10px;
  }

  .historial-movimiento-superior > div {
    min-width: 0;

    display: flex;

    flex-direction: column;

    gap: 3px;
  }

  .historial-movimiento-superior strong {
    color: #183c5b;

    font-size: 14px;

    line-height: 1.25;

    font-weight: 700;

    word-break: break-word;
  }

  .historial-placa {
    color: #7290a7;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 0.35px;
  }

  .historial-fecha {
    flex: 0 0 auto;

    color: #90a2b2;

    font-size: 10px;

    font-weight: 500;

    white-space: nowrap;
  }

  .historial-accion {
    color: #2569a8;

    font-size: 12px;

    line-height: 1.3;

    font-weight: 700;
  }

  .historial-detalle {
    color: #698399;

    font-size: 11px;

    line-height: 1.45;

    word-break: break-word;
  }

  .historial-usuario {
    display: flex;

    align-items: center;

    gap: 5px;

    color: #8399ac;

    font-size: 10px;

    font-weight: 600;

    margin-top: 2px;
  }

  .historial-movimiento-flecha {
    width: 34px;

    height: 34px;

    border: 0;

    border-radius: 11px;

    background: rgba(38, 119, 196, 0.07);

    color: #6e91ad;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    transition:
      transform 0.18s ease,
      background 0.18s ease;
  }

  .historial-movimiento-flecha:hover {
    background: rgba(38, 119, 196, 0.13);

    transform: translateX(2px);
  }

  /* =====================================================
   ESTADOS VACÍO / CARGANDO
===================================================== */

  .historial-vacio,
  .historial-cargando {
    width: 100%;

    min-height: 220px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 9px;

    padding: 32px 20px;

    border: 1px solid rgba(86, 159, 214, 0.13);

    border-radius: 22px;

    background: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.95),
      rgba(239, 248, 255, 0.88)
    );

    box-shadow: 0 8px 26px rgba(41, 117, 178, 0.07);

    box-sizing: border-box;

    text-align: center;
  }

  .historial-vacio-icono,
  .historial-cargando-icono {
    width: 62px;

    height: 62px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 20px;

    background: linear-gradient(
      135deg,
      rgba(0, 174, 255, 0.13),
      rgba(38, 109, 255, 0.09)
    );

    font-size: 27px;

    margin-bottom: 3px;
  }

  .historial-vacio strong,
  .historial-cargando strong {
    color: #294b68;

    font-size: 15px;
  }

  .historial-vacio span,
  .historial-cargando span {
    max-width: 320px;

    color: #8299ad;

    font-size: 12px;

    line-height: 1.5;
  }

  /* =====================================================
   BOTÓN REINTENTAR
===================================================== */

  .historial-boton-principal {
    margin-top: 7px;

    min-height: 44px;

    padding: 0 18px;

    border: 0;

    border-radius: 14px;

    background: linear-gradient(135deg, #159bff, #3478f6);

    color: #ffffff;

    font-family: inherit;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    box-shadow: 0 8px 18px rgba(39, 126, 232, 0.2);

    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease;
  }

  .historial-boton-principal:hover {
    transform: translateY(-1px);

    box-shadow: 0 11px 22px rgba(39, 126, 232, 0.25);
  }

  /* =====================================================
   DETALLE DEL MOVIMIENTO
===================================================== */

  .historial-detalle-vista {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 18px;
  }

  .historial-submodulo-volver {
    align-self: flex-start;

    border: 0;

    background: transparent;

    color: #2878ba;

    font-family: inherit;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    padding: 4px 0;
  }

  .historial-detalle-encabezado {
    display: flex;

    align-items: center;

    gap: 14px;
  }

  .historial-detalle-icono {
    width: 56px;

    height: 56px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 17px;

    background: linear-gradient(
      135deg,
      rgba(0, 174, 255, 0.14),
      rgba(38, 109, 255, 0.1)
    );

    font-size: 26px;
  }

  .historial-detalle-encabezado h3 {
    margin: 0 0 4px 0;

    color: #193d5c;

    font-size: 18px;

    line-height: 1.25;
  }

  .historial-detalle-encabezado p {
    margin: 0;

    color: #8097aa;

    font-size: 12px;
  }

  .historial-detalle-card {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 0;

    background: rgba(255, 255, 255, 0.96);

    border: 1px solid rgba(80, 155, 216, 0.13);

    border-radius: 20px;

    overflow: hidden;

    box-shadow: 0 9px 26px rgba(41, 117, 178, 0.07);
  }

  .historial-detalle-fila {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 18px;

    padding: 15px 17px;

    border-bottom: 1px solid rgba(92, 154, 197, 0.09);
  }

  .historial-detalle-fila:last-child {
    border-bottom: 0;
  }

  .historial-detalle-fila span {
    color: #8098ab;

    font-size: 11px;

    font-weight: 600;
  }

  .historial-detalle-fila strong {
    max-width: 62%;

    color: #284b67;

    font-size: 12px;

    text-align: right;

    word-break: break-word;
  }

  .historial-detalle-cambio {
    display: grid;

    grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr);

    align-items: center;

    gap: 8px;

    padding: 16px;

    background: rgba(235, 247, 255, 0.48);

    border-bottom: 1px solid rgba(92, 154, 197, 0.09);
  }

  .historial-detalle-cambio > div:not(.historial-detalle-flecha) {
    min-width: 0;

    display: flex;

    flex-direction: column;

    gap: 5px;
  }

  .historial-detalle-cambio small {
    color: #8aa0b2;

    font-size: 10px;

    font-weight: 600;
  }

  .historial-detalle-cambio strong {
    color: #284b67;

    font-size: 12px;

    line-height: 1.4;

    word-break: break-word;
  }

  .historial-detalle-flecha {
    color: #3483bd;

    font-size: 18px;

    text-align: center;
  }

  /* =====================================================
   RESPONSIVE
===================================================== */

  @media (max-width: 700px) {
    .historial-categorias {
      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }

    .historial-categoria {
      min-height: 106px;

      grid-template-columns: 44px minmax(0, 1fr) 16px;

      gap: 9px;

      padding: 14px;
    }

    .historial-categoria-icono {
      width: 44px;

      height: 44px;

      border-radius: 14px;

      font-size: 20px;
    }

    .historial-categoria-texto strong {
      font-size: 13px;
    }

    .historial-categoria-texto span {
      font-size: 10px;
    }

    .historial-categoria-flecha {
      font-size: 22px;
    }

    .historial-movimiento-card {
      grid-template-columns: 44px minmax(0, 1fr) 30px;

      gap: 10px;

      padding: 13px;
    }

    .historial-movimiento-icono {
      width: 44px;

      height: 44px;

      border-radius: 13px;

      font-size: 20px;
    }

    .historial-movimiento-superior {
      flex-direction: column;

      gap: 3px;
    }

    .historial-fecha {
      font-size: 9px;
    }

    .historial-movimiento-flecha {
      width: 30px;

      height: 30px;

      font-size: 22px;
    }

    .historial-detalle-cambio {
      grid-template-columns: 1fr;

      gap: 10px;
    }

    .historial-detalle-flecha {
      transform: rotate(90deg);
    }
  }

  @media (max-width: 430px) {
    .historial-categorias {
      grid-template-columns: 1fr;
    }

    .historial-categoria {
      min-height: 94px;

      grid-template-columns: 46px minmax(0, 1fr) 18px;
    }

    .historial-categoria-texto strong {
      font-size: 14px;
    }

    .historial-categoria-texto span {
      font-size: 11px;
    }

    .historial-buscador {
      min-height: 54px;

      padding: 0 13px;

      border-radius: 16px;
    }

    .historial-movimiento-card {
      grid-template-columns: 42px minmax(0, 1fr) 28px;

      padding: 12px;

      border-radius: 16px;
    }

    .historial-movimiento-icono {
      width: 42px;

      height: 42px;
    }

    .historial-detalle-fila {
      flex-direction: column;

      gap: 5px;
    }

    .historial-detalle-fila strong {
      max-width: 100%;

      text-align: left;
    }
  }

  /* -----------------------------------------------------
   BUSCADOR
----------------------------------------------------- */

  .parqueadero-buscador {
    position: relative;

    width: 100%;

    margin: 18px 0 24px;
  }

  .parqueadero-buscador-input {
    width: 100%;
    height: 54px;

    padding: 0 18px 0 50px;

    border: 1px solid rgba(90, 160, 230, 0.16);
    border-radius: 18px;

    outline: none;

    background: rgba(255, 255, 255, 0.88);

    color: #17324d;

    font-size: 16px;
    font-family: inherit;

    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.08);

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      background 0.2s ease;
  }

  .parqueadero-buscador-input::placeholder {
    color: #8ea1b4;
  }

  .parqueadero-buscador-input:focus {
    border-color: rgba(37, 99, 235, 0.38);

    background: #ffffff;

    box-shadow:
      0 10px 24px rgba(59, 130, 246, 0.12),
      0 0 0 4px rgba(59, 130, 246, 0.07);
  }

  .parqueadero-buscador-icono {
    position: absolute;

    left: 18px;
    top: 50%;

    transform: translateY(-50%);

    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    line-height: 1;

    pointer-events: none;
  }

  /* -----------------------------------------------------
   RESUMEN DE UBICACIÓN
----------------------------------------------------- */

  .parqueadero-resumen {
    width: 100%;

    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 11px;

    margin: 0 0 22px;
  }

  .parqueadero-resumen-card {
    min-height: 76px;

    display: flex;
    align-items: center;

    gap: 11px;

    padding: 12px 13px;

    border: 1px solid rgba(255, 255, 255, 0.76);
    border-radius: 19px;

    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.78),
      rgba(229, 244, 255, 0.62)

    box-shadow:
      0 8px 20px rgba(40, 100, 150, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.92);

    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }

  /* ==========================================
   LOTTIE - RESUMEN UBICADOS
========================================== */

  .parqueadero-resumen-icono.parqueadero-resumen-icono-lottie {
    width: 52px;
    height: 52px;

    background: transparent;
    box-shadow: none;
    border-radius: 0;

    overflow: visible;
  }

  .parqueadero-resumen-icono-lottie lottie-player {
    width: 58px;
    height: 58px;

    display: block;
  }

  .parqueadero-resumen-contenido {
    min-width: 0;

    display: flex;
    flex-direction: column;

    gap: 2px;
  }

  .parqueadero-resumen-label {
    color: #7892a9;

    font-size: 10px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 0.45px;
  }

  .parqueadero-resumen-valor {
    color: #173d61;

    font-size: 21px;
    font-weight: 800;

    line-height: 1;
  }

  /* -----------------------------------------------------
   GRUPOS DE PARQUEADERO
----------------------------------------------------- */

  .parqueadero-grupo {
    width: 100%;

    margin-bottom: 22px;
  }

  .parqueadero-grupo-encabezado {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 10px;
    padding: 0 4px;
  }

  .parqueadero-grupo-titulo {
    display: flex;
    align-items: center;

    gap: 11px;
  }

  .parqueadero-grupo-icono {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    background: transparent;
    box-shadow: none;
    border-radius: 0;

    overflow: visible;
  }

  .parqueadero-grupo-icono lottie-player {
    width: 54px;
    height: 54px;

    display: block;
  }

  .parqueadero-grupo-titulo h3 {
    margin: 0;

    color: #17324d;

    font-size: 16px;
    font-weight: 750;

    line-height: 1.2;
  }

  .parqueadero-grupo-titulo span {
    display: block;

    margin-top: 3px;

    color: #7b8ea2;

    font-size: 12px;
    font-weight: 500;
  }

  /* -----------------------------------------------------
   TARJETAS DE VEHÍCULOS
----------------------------------------------------- */

  .parqueadero-grupo-lista {
    display: flex;
    flex-direction: column;

    gap: 10px;
  }

  .parqueadero-vehiculo-card {
    width: 100%;
  }

  .parqueadero-vehiculo-boton {
    width: 100%;
    min-height: 78px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 10px 14px;

    border: 1px solid rgba(120, 170, 220, 0.12);
    border-radius: 20px;

    background: rgba(255, 255, 255, 0.88);

    box-shadow: 0 7px 18px rgba(52, 103, 160, 0.07);

    color: inherit;

    font-family: inherit;

    text-align: left;

    cursor: pointer;

    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease,
      border-color 0.18s ease,
      background 0.18s ease;
  }

  .parqueadero-vehiculo-boton:hover {
    transform: translateY(-1px);

    border-color: rgba(59, 130, 246, 0.2);

    box-shadow: 0 10px 22px rgba(52, 103, 160, 0.1);
  }

  .parqueadero-vehiculo-boton:active {
    transform: scale(0.985);
  }

  .parqueadero-vehiculo-icono {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 15px;

    background: linear-gradient(
      135deg,
      rgba(219, 234, 254, 0.95),
      rgba(224, 242, 254, 0.95)
    );

    font-size: 21px;
  }

  .parqueadero-vehiculo-info {
    min-width: 0;

    flex: 1;

    display: flex;
    flex-direction: column;
  }

  .parqueadero-vehiculo-info strong {
    overflow: hidden;

    color: #17324d;

    font-size: 14px;
    font-weight: 700;

    line-height: 1.25;

    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .parqueadero-vehiculo-info small {
    margin-top: 2px;

    color: #8a9daf;

    font-size: 11px;
    font-weight: 600;
  }

  .parqueadero-vehiculo-info span {
    margin-top: 5px;

    color: #4d78a5;

    font-size: 12px;
    font-weight: 600;
  }

  .parqueadero-vehiculo-flecha {
    width: 26px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    color: #6fa1d8;

    font-size: 27px;
    font-weight: 300;
  }

  /* -----------------------------------------------------
   MOSTRAR MÁS
----------------------------------------------------- */

  .parqueadero-mostrar-mas {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 9px;
    padding: 10px 5px 3px;

    border: 0;

    background: transparent;

    color: #2879db;

    font-family: inherit;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;
  }

  .parqueadero-mostrar-mas span:last-child {
    font-size: 16px;

    transition: transform 0.2s ease;
  }

  .parqueadero-grupo-expandido .parqueadero-mostrar-mas span:last-child {
    transform: translateY(-1px);
  }

  /* -----------------------------------------------------
   RESULTADO DE BÚSQUEDA
----------------------------------------------------- */

  .parqueadero-resultado-texto {
    margin: -9px 0 12px;
    padding: 0 4px;

    color: #7b8ea2;

    font-size: 12px;
    font-weight: 600;
  }

  /* -----------------------------------------------------
   ESTADO VACÍO
----------------------------------------------------- */

  .parqueadero-estado-vacio {
    width: 100%;

    padding: 34px 20px;

    border: 1px solid rgba(120, 170, 220, 0.1);
    border-radius: 24px;

    background: rgba(255, 255, 255, 0.72);

    text-align: center;

    box-shadow: 0 8px 22px rgba(52, 103, 160, 0.06);
  }

  .parqueadero-estado-vacio-icono {
    width: 54px;
    height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 12px;

    border-radius: 17px;

    background: rgba(219, 234, 254, 0.8);

    font-size: 22px;
  }

  .parqueadero-estado-vacio strong {
    display: block;

    color: #17324d;

    font-size: 15px;
  }

  .parqueadero-estado-vacio p {
    margin: 6px 0 0;

    color: #8799ab;

    font-size: 12px;
    line-height: 1.5;
  }

  /* =====================================================
   DETALLE DEL VEHÍCULO — UBICACIÓN
===================================================== */

  .ubicacion-detalle {
    width: 100%;
  }

  /* -----------------------------------------------------
   BOTÓN VOLVER
----------------------------------------------------- */

  .ubicacion-detalle-volver {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    margin: 0 0 18px;
    padding: 9px 13px;

    border: 0;
    border-radius: 14px;

    background: rgba(255, 255, 255, 0.72);

    color: #2578b9;

    font-family: inherit;
    font-size: 13px;
    font-weight: 800;

    box-shadow: 0 6px 16px rgba(40, 100, 150, 0.08);

    cursor: pointer;

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease,
      background 0.2s ease;
  }

  .ubicacion-detalle-volver:hover {
    transform: translateY(-1px);

    background: rgba(255, 255, 255, 0.92);

    box-shadow: 0 9px 20px rgba(40, 100, 150, 0.11);
  }

  .ubicacion-detalle-volver:active {
    transform: scale(0.97);
  }

  /* -----------------------------------------------------
   ENCABEZADO DEL VEHÍCULO
----------------------------------------------------- */

  .ubicacion-detalle-hero {
    display: flex;
    align-items: center;

    gap: 14px;

    margin-bottom: 18px;
    padding: 15px;

    border: 1px solid rgba(255, 255, 255, 0.78);
    border-radius: 21px;

    background: rgba(255, 255, 255, 0.58);

    box-shadow:
      0 8px 22px rgba(40, 100, 150, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .ubicacion-detalle-imagen {
    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 18px;

    background: linear-gradient(135deg, #147eea, #17bce9);

    color: white;

    font-size: 25px;

    box-shadow: 0 9px 20px rgba(20, 126, 234, 0.2);
  }

  .ubicacion-detalle-identificacion {
    min-width: 0;

    display: flex;
    flex-direction: column;
  }

  .ubicacion-detalle-identificacion > span {
    margin-bottom: 3px;

    color: #7f97aa;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 0.7px;
  }

  .ubicacion-detalle-identificacion h3 {
    margin: 0;

    color: #173d61;

    font-size: 17px;
    font-weight: 800;

    line-height: 1.25;

    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ubicacion-detalle-identificacion p {
    margin: 4px 0 0;

    color: #6e879e;

    font-size: 12px;
    font-weight: 700;
  }

  /* -----------------------------------------------------
   TARJETA DE UBICACIÓN
----------------------------------------------------- */

  .ubicacion-detalle-card {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 10px;

    padding: 15px;

    border: 1px solid rgba(255, 255, 255, 0.78);
    border-radius: 21px;

    background: rgba(255, 255, 255, 0.58);

    box-shadow:
      0 8px 22px rgba(40, 100, 150, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .ubicacion-detalle-dato {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 12px;

    border-radius: 16px;

    background: rgba(255, 255, 255, 0.62);
  }

  .ubicacion-detalle-dato > span {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 13px;

    background: linear-gradient(
      135deg,
      rgba(219, 234, 254, 0.95),
      rgba(224, 242, 254, 0.95)
    );

    font-size: 18px;
  }

  .ubicacion-detalle-dato > div {
    min-width: 0;

    display: flex;
    flex-direction: column;

    gap: 3px;
  }

  .ubicacion-detalle-dato small {
    color: #8198aa;

    font-size: 10px;
    font-weight: 800;

    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .ubicacion-detalle-dato strong {
    color: #244968;

    font-size: 14px;
    font-weight: 800;

    overflow-wrap: anywhere;
  }

  /* -----------------------------------------------------
   BOTÓN EDITAR UBICACIÓN
----------------------------------------------------- */

  .ubicacion-detalle-editar {
    width: 100%;
    min-height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 13px;
    padding: 0 15px;

    border: 0;
    border-radius: 16px;

    background: linear-gradient(135deg, #147eea, #16b8e8);

    color: white;

    font-family: inherit;

    font-size: 13px;
    font-weight: 800;

    box-shadow: 0 9px 20px rgba(20, 126, 234, 0.2);

    cursor: pointer;

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease;
  }

  .ubicacion-detalle-editar:hover {
    transform: translateY(-1px);

    box-shadow: 0 12px 24px rgba(20, 126, 234, 0.25);
  }

  .ubicacion-detalle-editar:active {
    transform: scale(0.98);
  }

  /* =====================================================
   GESTIÓN → EDITAR CARROS
===================================================== */

  .editor-vehiculo-panel {
    width: 100%;
  }

  .editor-vehiculo-encabezado {
    display: flex;
    align-items: center;

    gap: 13px;

    margin-bottom: 20px;
    padding-bottom: 17px;

    border-bottom: 1px solid rgba(72, 135, 177, 0.12);
  }

  .editor-vehiculo-imagen {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 16px;

    background: linear-gradient(135deg, #147eea, #17bce9);

    color: white;

    font-size: 23px;

    box-shadow: 0 9px 20px rgba(20, 126, 234, 0.2);
  }

  .editor-vehiculo-identificacion {
    min-width: 0;
  }

  .editor-vehiculo-identificacion h3 {
    margin: 0;

    color: #173e62;

    font-size: 17px;
    font-weight: 800;

    line-height: 1.25;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .editor-vehiculo-identificacion p {
    margin: 4px 0 0;

    color: #7691a8;

    font-size: 12px;
    font-weight: 700;
  }

  /* =====================================================
   FORMULARIO
===================================================== */

  .editor-vehiculo-form {
    display: flex;
    flex-direction: column;

    gap: 0;
  }

  .editor-vehiculo-campo {
    display: flex;
    flex-direction: column;

    margin-bottom: 15px;
  }

  .editor-vehiculo-campo label {
    display: flex;
    align-items: center;

    gap: 7px;

    margin-bottom: 7px;

    color: #42627e;

    font-size: 12px;
    font-weight: 800;
  }

  .editor-vehiculo-icono {
    width: 24px;
    height: 24px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 8px;

    background: rgba(20, 126, 234, 0.09);

    font-size: 13px;
  }

  .editor-vehiculo-input,
  .editor-vehiculo-textarea {
    width: 100%;

    border: 1px solid rgba(100, 155, 193, 0.18);
    border-radius: 15px;

    outline: none;

    background: rgba(255, 255, 255, 0.7);

    color: #244866;

    font-family: inherit;
    font-size: 13px;

    box-shadow:
      inset 0 1px 2px rgba(30, 90, 140, 0.03),
      0 5px 15px rgba(40, 100, 150, 0.04);

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      background 0.2s ease;
  }

  .editor-vehiculo-input {
    height: 50px;

    padding: 0 15px;
  }

  .editor-vehiculo-textarea {
    min-height: 115px;

    padding: 13px 15px;

    resize: vertical;

    line-height: 1.5;
  }

  .editor-vehiculo-input::placeholder,
  .editor-vehiculo-textarea::placeholder {
    color: #9aabba;
  }

  .editor-vehiculo-input:focus,
  .editor-vehiculo-textarea:focus {
    border-color: rgba(20, 126, 234, 0.4);

    background: rgba(255, 255, 255, 0.88);

    box-shadow: 0 0 0 4px rgba(20, 126, 234, 0.08);
  }

  .editor-vehiculo-campo-grande {
    margin-bottom: 16px;
  }

  /* =====================================================
   INFORMACIÓN DE PARQUEADERO
===================================================== */

  .editor-vehiculo-ubicacion-info {
    margin-top: 1px;
  }

  .editor-vehiculo-ayuda {
    display: flex;
    align-items: flex-start;

    gap: 9px;

    padding: 12px 13px;

    border-radius: 14px;

    background: rgba(20, 126, 234, 0.06);

    color: #69849d;

    font-size: 11px;
    line-height: 1.45;
  }

  .editor-vehiculo-ayuda strong {
    color: #2878ba;
  }

  /* =====================================================
   MENSAJE
===================================================== */

  .editor-vehiculo-mensaje {
    margin-bottom: 14px;
    padding: 11px 13px;

    border-radius: 13px;

    font-size: 12px;
    line-height: 1.4;
  }

  .editor-vehiculo-mensaje-error {
    background: rgba(255, 78, 78, 0.09);

    color: #c24848;
  }

  .editor-vehiculo-mensaje-success {
    background: rgba(38, 177, 109, 0.1);

    color: #27885d;
  }

  /* =====================================================
   BOTÓN PRINCIPAL
===================================================== */

  .editor-vehiculo-boton-principal {
    width: 100%;
    min-height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    border: 0;
    border-radius: 16px;

    background: linear-gradient(135deg, #147eea, #16b8e8);

    color: white;

    font-family: inherit;

    font-size: 13px;
    font-weight: 800;

    box-shadow: 0 9px 20px rgba(20, 126, 234, 0.2);

    cursor: pointer;

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease,
      opacity 0.2s ease;
  }

  .editor-vehiculo-boton-principal:hover {
    transform: translateY(-1px);

    box-shadow: 0 12px 24px rgba(20, 126, 234, 0.25);
  }

  .editor-vehiculo-boton-principal:active {
    transform: scale(0.98);
  }

  .editor-vehiculo-boton-principal:disabled {
    opacity: 0.6;

    cursor: wait;
  }

  /* =====================================================
   BOTÓN SECUNDARIO
===================================================== */

  .editor-vehiculo-boton-secundario {
    width: 100%;
    min-height: 46px;

    margin-top: 9px;

    border: 1px solid rgba(100, 155, 193, 0.16);
    border-radius: 15px;

    background: rgba(255, 255, 255, 0.58);

    color: #55758f;

    font-family: inherit;

    font-size: 12px;
    font-weight: 800;

    cursor: pointer;

    transition:
      transform 0.2s ease,
      background 0.2s ease,
      box-shadow 0.2s ease;
  }

  .editor-vehiculo-boton-secundario:hover {
    transform: translateY(-1px);

    background: rgba(255, 255, 255, 0.82);

    box-shadow: 0 7px 17px rgba(40, 100, 150, 0.08);
  }

  .editor-vehiculo-boton-secundario:active {
    transform: scale(0.98);
  }

  /* =====================================================
   CONFIRMACIÓN
===================================================== */

  .editor-vehiculo-confirmacion {
    position: fixed;

    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(10, 35, 65, 0.28);

    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);

    z-index: 10000;
  }

  .editor-vehiculo-confirmacion-card {
    width: min(100%, 390px);

    padding: 24px 20px 20px;

    border: 1px solid rgba(255, 255, 255, 0.86);
    border-radius: 24px;

    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.96),
      rgba(233, 246, 255, 0.94)
    );

    text-align: center;

    box-shadow:
      0 20px 50px rgba(20, 80, 140, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.98);

    backdrop-filter: blur(20px) saturate(145%);
    -webkit-backdrop-filter: blur(20px) saturate(145%);
  }

  .editor-vehiculo-confirmacion-icono {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 14px;

    border-radius: 17px;

    background: linear-gradient(135deg, #147eea, #17bce9);

    color: white;

    font-size: 24px;
    font-weight: 900;

    box-shadow: 0 9px 20px rgba(20, 126, 234, 0.2);
  }

  .editor-vehiculo-confirmacion-card h3 {
    margin: 0;

    color: #173d61;

    font-size: 19px;
    font-weight: 800;
  }

  .editor-vehiculo-confirmacion-card p {
    margin: 7px 0 18px;

    color: #718da7;

    font-size: 12px;
    line-height: 1.5;
  }

  /* =====================================================
   RESULTADO EXITOSO
===================================================== */

  .editor-vehiculo-resultado {
    width: 100%;

    padding: 28px 20px;

    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 23px;

    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.86),
      rgba(228, 246, 237, 0.72)
    );

    text-align: center;

    box-shadow:
      0 14px 32px rgba(40, 110, 150, 0.1),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }

  .editor-vehiculo-resultado-icono {
    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 15px;

    border-radius: 19px;

    background: linear-gradient(135deg, #22a866, #35c982);

    color: white;

    font-size: 27px;
    font-weight: 900;

    box-shadow: 0 10px 22px rgba(34, 168, 102, 0.2);
  }

  .editor-vehiculo-resultado h3 {
    margin: 0;

    color: #235b46;

    font-size: 19px;
    font-weight: 800;
  }

  .editor-vehiculo-resultado p {
    margin: 7px 0 18px;

    color: #668b7b;

    font-size: 12px;
    line-height: 1.5;
  }

  /* =====================================================
   GESTIÓN — EDITAR UBICACIÓN
===================================================== */

  .editor-ubicacion-panel {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    background: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.88),
      rgba(239, 247, 255, 0.76)
    );
    border: 1px solid rgba(255, 255, 255, 0.78);
    border-radius: 28px;
    box-shadow:
      0 18px 45px rgba(30, 90, 160, 0.1),
      inset 0 1px 0 rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px) saturate(135%);
    -webkit-backdrop-filter: blur(18px) saturate(135%);
  }

  /* -----------------------------------------------------
   ENCABEZADO
----------------------------------------------------- */

  .editor-ubicacion-volver {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
    padding: 9px 14px;
    border: none;
    border-radius: 14px;
    background: rgba(225, 239, 255, 0.78);
    color: #1677d2;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition:
      transform 0.18s ease,
      background 0.18s ease;
  }

  .editor-ubicacion-volver:hover {
    background: rgba(210, 231, 255, 0.92);
    transform: translateX(-2px);
  }

  .editor-ubicacion-volver:active {
    transform: scale(0.97);
  }

  .editor-ubicacion-encabezado {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 24px;
    padding: 16px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.64);
    border: 1px solid rgba(255, 255, 255, 0.82);
  }

  .editor-ubicacion-icono {
    width: 58px;
    height: 58px;
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: linear-gradient(
      145deg,
      rgba(30, 144, 255, 0.16),
      rgba(0, 198, 255, 0.1)
    );
    font-size: 28px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
  }

  .editor-ubicacion-identificacion {
    min-width: 0;
  }

  .editor-ubicacion-identificacion span {
    display: block;
    margin-bottom: 4px;
    color: #7b8da3;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }

  .editor-ubicacion-identificacion h3 {
    margin: 0;
    color: #17324d;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 800;
  }

  .editor-ubicacion-identificacion p {
    margin: 5px 0 0;
    color: #6e8299;
    font-size: 13px;
    font-weight: 600;
  }

  /* -----------------------------------------------------
   FORMULARIO
----------------------------------------------------- */

  .editor-ubicacion-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .editor-ubicacion-campo {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .editor-ubicacion-campo label {
    color: #35506b;
    font-size: 13px;
    font-weight: 800;
  }

  .editor-ubicacion-input {
    width: 100%;
    min-height: 52px;
    padding: 0 16px;
    border: 1px solid rgba(126, 165, 205, 0.24);
    border-radius: 16px;
    outline: none;
    background: rgba(255, 255, 255, 0.78);
    color: #18344d;
    font-size: 15px;
    font-weight: 600;
    box-shadow:
      inset 0 1px 2px rgba(30, 90, 160, 0.03),
      0 5px 16px rgba(30, 90, 160, 0.04);
    transition:
      border-color 0.18s ease,
      box-shadow 0.18s ease,
      background 0.18s ease;
  }

  .editor-ubicacion-input::placeholder {
    color: #9aabbd;
    font-weight: 500;
  }

  .editor-ubicacion-input:focus {
    background: #ffffff;
    border-color: rgba(28, 132, 235, 0.46);
    box-shadow:
      0 0 0 4px rgba(28, 132, 235, 0.1),
      0 8px 20px rgba(30, 90, 160, 0.07);
  }

  /* -----------------------------------------------------
   MENSAJE
----------------------------------------------------- */

  .editor-ubicacion-mensaje {
    min-height: 20px;
    margin-top: 14px;
    padding: 0 2px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
  }

  .editor-ubicacion-mensaje.error {
    color: #d94b4b;
  }

  .editor-ubicacion-mensaje.success {
    color: #15905f;
  }

  /* -----------------------------------------------------
   BOTÓN PRINCIPAL
----------------------------------------------------- */

  .editor-ubicacion-boton-principal {
    width: 100%;
    min-height: 52px;
    margin-top: 8px;
    padding: 0 18px;
    border: none;
    border-radius: 17px;
    background: linear-gradient(135deg, #1687eb, #17b9e8);
    color: #ffffff;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(17, 137, 225, 0.22);
    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease,
      opacity 0.18s ease;
  }

  .editor-ubicacion-boton-principal:hover {
    transform: translateY(-1px);
    box-shadow: 0 13px 28px rgba(17, 137, 225, 0.26);
  }

  .editor-ubicacion-boton-principal:active {
    transform: scale(0.98);
  }

  .editor-ubicacion-boton-principal:disabled {
    opacity: 0.62;
    cursor: wait;
    transform: none;
    box-shadow: 0 6px 16px rgba(17, 137, 225, 0.12);
  }

  /* =====================================================
   LISTA DE VEHÍCULOS — EDITAR UBICACIÓN
===================================================== */

  .gestion-ubicacion-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 11px;
    padding: 15px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.82);
    box-shadow: 0 8px 22px rgba(30, 90, 160, 0.06);
    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease,
      background 0.18s ease;
  }

  .gestion-ubicacion-item:hover {
    background: rgba(255, 255, 255, 0.84);
    transform: translateY(-1px);
    box-shadow: 0 11px 28px rgba(30, 90, 160, 0.09);
  }

  .gestion-ubicacion-info {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .gestion-ubicacion-icono {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    background: rgba(222, 239, 255, 0.88);
    font-size: 22px;
  }

  .gestion-ubicacion-datos {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .gestion-ubicacion-datos strong {
    overflow: hidden;
    color: #18354f;
    font-size: 15px;
    font-weight: 800;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .gestion-ubicacion-datos span {
    margin-top: 2px;
    color: #71859a;
    font-size: 12px;
    font-weight: 700;
  }

  .gestion-ubicacion-datos small {
    margin-top: 6px;
    color: #5c7187;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.55;
  }

  .gestion-ubicacion-boton {
    flex: 0 0 auto;
    min-width: 82px;
    min-height: 40px;
    padding: 0 14px;
    border: none;
    border-radius: 13px;
    background: rgba(222, 239, 255, 0.95);
    color: #1479d0;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition:
      transform 0.18s ease,
      background 0.18s ease;
  }

  .gestion-ubicacion-boton:hover {
    background: rgba(205, 230, 255, 1);
    transform: translateY(-1px);
  }

  .gestion-ubicacion-boton:active {
    transform: scale(0.97);
  }

  /* -----------------------------------------------------
   ESTADO VACÍO
----------------------------------------------------- */

  .gestion-vacio {
    width: 100%;
    padding: 30px 20px;
    text-align: center;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.62);
    color: #8092a6;
    font-size: 14px;
    font-weight: 600;
  }

  /* =====================================================
   MODAL DE CONFIRMACIÓN
===================================================== */

  .editor-ubicacion-confirmacion {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(14, 34, 56, 0.38);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .editor-ubicacion-confirmacion-card {
    width: 100%;
    max-width: 430px;
    padding: 26px;
    border-radius: 26px;
    background: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.97),
      rgba(241, 248, 255, 0.94)
    );
    border: 1px solid rgba(255, 255, 255, 0.92);
    box-shadow:
      0 24px 60px rgba(13, 54, 91, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.92);
    text-align: center;
  }

  .editor-ubicacion-confirmacion-icono {
    width: 58px;
    height: 58px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: rgba(221, 239, 255, 0.92);
    font-size: 27px;
  }

  .editor-ubicacion-confirmacion-card h3 {
    margin: 0;
    color: #193750;
    font-size: 21px;
    font-weight: 800;
  }

  .editor-ubicacion-confirmacion-card > p {
    margin: 8px 0 20px;
    color: #71859a;
    font-size: 13px;
    line-height: 1.5;
  }

  .editor-ubicacion-confirmacion-datos {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 20px;
    padding: 15px;
    border-radius: 18px;
    background: rgba(239, 247, 255, 0.72);
    text-align: left;
  }

  .editor-ubicacion-confirmacion-datos > strong {
    color: #193750;
    font-size: 15px;
    font-weight: 800;
  }

  .editor-ubicacion-confirmacion-datos > span {
    color: #71859a;
    font-size: 12px;
    font-weight: 700;
  }

  .editor-ubicacion-confirmacion-datos > div {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: 5px;
  }

  .editor-ubicacion-confirmacion-datos small {
    color: #8394a7;
    font-size: 11px;
    font-weight: 700;
  }

  .editor-ubicacion-confirmacion-datos div strong {
    color: #31506b;
    font-size: 13px;
    font-weight: 800;
  }

  .editor-ubicacion-confirmacion-botones {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 10px;
  }

  .editor-ubicacion-boton-secundario,
  .editor-ubicacion-confirmacion-botones .editor-ubicacion-boton-principal {
    min-height: 48px;
    border: none;
    border-radius: 15px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition:
      transform 0.18s ease,
      opacity 0.18s ease;
  }

  .editor-ubicacion-boton-secundario {
    background: rgba(225, 235, 245, 0.9);
    color: #557087;
  }

  .editor-ubicacion-boton-secundario:hover {
    transform: translateY(-1px);
    background: rgba(214, 228, 241, 1);
  }

  .editor-ubicacion-confirmacion-botones .editor-ubicacion-boton-principal {
    margin-top: 0;
  }

  .editor-ubicacion-boton-secundario:active,
  .editor-ubicacion-confirmacion-botones
    .editor-ubicacion-boton-principal:active {
    transform: scale(0.98);
  }

  /* =========================================================
   EDITAR PERFIL
========================================================= */

  #editorPerfilAdministracion {
    margin-top: 20px;
  }

  #editorPerfilAdministracion .perfil-panel {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 20px;
  }

  #editorPerfilAdministracion .perfil-panel-datos {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px 24px;
    width: 100%;
  }

  #editorPerfilAdministracion .perfil-panel-dato {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  #editorPerfilAdministracion .perfil-panel-dato span {
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
  }

  #editorPerfilAdministracion .perfil-panel-dato input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #ffffff;
    color: #111827;
    font-size: 14px;
    outline: none;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  #editorPerfilAdministracion .perfil-panel-dato input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  #editorPerfilAdministracion .perfil-panel-dato input:disabled {
    background: #f3f4f6;
    color: #6b7280;
    cursor: not-allowed;
  }

  #editorPerfilAdministracion .perfil-panel > div:last-child {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  #editorPerfilAdministracion .editor-panel-boton {
    cursor: pointer;
    margin-top: 10px;
  }

  /* Mensaje del formulario */
  #mensajeEditarPerfil {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
  }

  /* =====================================================
   MODAL INTERCAMBIAR PARQUEADERO
   ===================================================== */

  .modal-intercambio-parqueadero {
    position: fixed;
    inset: 0;

    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background: rgba(5, 22, 45, 0.38);

    backdrop-filter: blur(16px) saturate(140%);

    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }

  /* =====================================================
   TARJETA PRINCIPAL
   ===================================================== */

  .modal-intercambio-contenido {
    position: relative;

    width: min(500px, 100%);
    max-height: 88vh;

    padding: 34px 32px 28px;

    overflow-y: auto;

    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 32px;

    background: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.92),
      rgba(238, 247, 255, 0.78)
    );

    box-shadow:
      0 24px 70px rgba(16, 76, 135, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);

    backdrop-filter: blur(28px) saturate(150%);

    -webkit-backdrop-filter: blur(28px) saturate(150%);

    overflow-x: hidden;
  }

  /* Brillo decorativo */

  .modal-intercambio-contenido::before {
    content: "";

    position: absolute;

    top: -90px;
    right: -90px;

    width: 190px;
    height: 190px;

    border-radius: 50%;

    background: rgba(0, 151, 255, 0.1);

    filter: blur(10px);

    pointer-events: none;
  }

  /* =====================================================
   BOTÓN CERRAR
   ===================================================== */

  .modal-intercambio-cerrar {
    position: absolute;

    top: 17px;
    right: 17px;

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255, 255, 255, 0.75);
    border-radius: 13px;

    background: rgba(255, 255, 255, 0.62);

    color: #58748d;

    font-size: 18px;
    font-weight: 700;

    cursor: pointer;

    box-shadow: 0 5px 14px rgba(40, 100, 150, 0.07);

    transition:
      transform 0.18s ease,
      background 0.18s ease,
      box-shadow 0.18s ease;
  }

  .modal-intercambio-cerrar:hover {
    transform: translateY(-1px);

    background: rgba(255, 255, 255, 0.9);

    box-shadow: 0 8px 18px rgba(40, 100, 150, 0.11);
  }

  .modal-intercambio-cerrar:active {
    transform: scale(0.96);
  }

  /* =====================================================
   TÍTULO
   ===================================================== */

  .modal-intercambio-titulo {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    margin-bottom: 8px;

    color: #12345a;

    font-size: 24px;
    font-weight: 700;

    line-height: 1.2;

    text-align: center;
  }

  .modal-intercambio-titulo span:first-child {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 15px;

    background: linear-gradient(145deg, #0e6ae0, #0593ff);

    color: #ffffff;

    font-size: 22px;

    box-shadow:
      0 9px 20px rgba(14, 106, 224, 0.22),
      inset 0 1px 1px rgba(255, 255, 255, 0.35);
  }

  /* =====================================================
   SUBTÍTULO
   ===================================================== */

  .modal-intercambio-subtitulo {
    position: relative;

    max-width: 360px;

    margin: 0 auto 22px;

    color: #647b96;

    font-size: 13px;
    font-weight: 400;

    line-height: 1.5;

    text-align: center;
  }

  /* =====================================================
   VEHÍCULO ACTUAL
   ===================================================== */

  .intercambio-vehiculo-actual {
    position: relative;

    padding: 18px;

    border: 1px solid rgba(255, 255, 255, 0.82);

    border-radius: 20px;

    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.78),
      rgba(231, 244, 255, 0.7)
    );

    box-shadow:
      0 8px 22px rgba(40, 100, 150, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);
  }

  /* =====================================================
   ETIQUETA
   ===================================================== */

  .intercambio-vehiculo-etiqueta {
    margin-bottom: 7px;

    color: #147eea;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 0.07em;

    text-transform: uppercase;
  }

  /* =====================================================
   DATOS VEHÍCULO ACTUAL
   ===================================================== */

  #intercambioVehiculoActual strong {
    display: block;

    margin-bottom: 6px;

    color: #244a68;

    font-size: 17px;
    font-weight: 700;
  }

  #intercambioVehiculoActual div {
    margin-top: 4px;

    color: #718da7;

    font-size: 13px;
    line-height: 1.4;
  }

  /* =====================================================
   FLECHAS
   ===================================================== */

  .intercambio-flechas {
    width: 48px;
    height: 48px;

    margin: 13px auto;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 15px;

    background: linear-gradient(
      135deg,
      rgba(20, 126, 234, 0.1),
      rgba(23, 188, 233, 0.15)
    );

    color: #147eea;

    font-size: 25px;

    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }

  /* =====================================================
   BUSCADOR
   ===================================================== */

  .intercambio-buscador {
    position: relative;

    display: flex;
    align-items: center;

    width: 100%;
    min-height: 54px;

    box-sizing: border-box;

    gap: 10px;

    margin-bottom: 12px;

    padding: 0 16px;

    border: 1px solid rgba(152, 181, 211, 0.45);

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.68);

    box-shadow: inset 0 1px 2px rgba(30, 75, 120, 0.04);

    transition:
      border-color 0.18s ease,
      box-shadow 0.18s ease;
  }

  .intercambio-buscador:focus-within {
    border-color: rgba(20, 126, 234, 0.55);

    box-shadow:
      0 0 0 3px rgba(20, 126, 234, 0.09),
      inset 0 1px 2px rgba(30, 75, 120, 0.04);
  }

  .intercambio-buscador span {
    flex-shrink: 0;

    color: #147eea;

    font-size: 18px;
  }

  .intercambio-buscador input {
    flex: 1;

    min-width: 0;

    height: 52px;

    padding: 0;

    border: none;
    outline: none;

    background: transparent;

    color: #173b61;

    font-family: inherit;

    font-size: 14px;
  }

  .intercambio-buscador input::placeholder {
    color: #8aa1b5;
  }

  /* =====================================================
   LISTA DE RESULTADOS
   ===================================================== */

  .lista-intercambio-parqueadero {
    display: flex;
    flex-direction: column;

    gap: 9px;

    max-height: 230px;

    overflow-y: auto;

    padding-right: 3px;
  }

  /* =====================================================
   RESULTADO
   ===================================================== */

  .intercambio-vehiculo-resultado {
    position: relative;

    padding: 15px 16px;

    border: 1px solid rgba(152, 181, 211, 0.28);

    border-radius: 17px;

    background: rgba(255, 255, 255, 0.6);

    box-shadow: 0 5px 15px rgba(40, 100, 150, 0.045);

    cursor: pointer;

    transition:
      transform 0.18s ease,
      background 0.18s ease,
      border-color 0.18s ease,
      box-shadow 0.18s ease;
  }

  .intercambio-vehiculo-resultado:hover {
    transform: translateY(-1px);

    border-color: rgba(20, 126, 234, 0.32);

    background: rgba(255, 255, 255, 0.84);

    box-shadow: 0 8px 20px rgba(40, 100, 150, 0.08);
  }

  .intercambio-vehiculo-resultado:active {
    transform: scale(0.99);
  }

  /* Resultado seleccionado */

  .intercambio-vehiculo-resultado.seleccionado {
    border: 2px solid #147eea;

    background: linear-gradient(
      135deg,
      rgba(235, 247, 255, 0.92),
      rgba(220, 242, 255, 0.78)
    );

    box-shadow:
      0 8px 22px rgba(20, 126, 234, 0.13),
      inset 0 1px 0 rgba(255, 255, 255, 0.92);
  }

  .intercambio-vehiculo-resultado strong {
    display: block;

    margin-bottom: 5px;

    color: #244a68;

    font-size: 15px;
    font-weight: 700;
  }

  .intercambio-vehiculo-resultado div {
    margin-top: 3px;

    color: #718da7;

    font-size: 12px;

    line-height: 1.4;
  }

  /* =====================================================
   VEHÍCULO PARA INTERCAMBIO
   ===================================================== */

  .intercambio-vehiculo-segundo {
    position: relative;

    padding: 18px;

    margin-bottom: 14px;

    border: 1px solid rgba(20, 126, 234, 0.28);

    border-radius: 20px;

    background: linear-gradient(
      135deg,
      rgba(235, 247, 255, 0.92),
      rgba(220, 242, 255, 0.78)
    );

    box-shadow:
      0 8px 22px rgba(20, 126, 234, 0.08),
